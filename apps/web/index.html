<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <!-- interactive-widget: the virtual keyboard resizes the layout viewport
         instead of scrolling it, so the composer stays above the keyboard and
         the 100dvh shell shrinks with it (issue #467). -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, interactive-widget=resizes-content"
    />
    <link rel="icon" type="image/png" href="/assets/favicon.png" />
    <title>NIC Chat</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
