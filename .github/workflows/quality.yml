name: Quality

on:
  pull_request:
    branches:
      - main
      - develop
  push:
    branches:
      - main
      - develop
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25.11"
          cache-dependency-path: |
            services/*/go.mod
            libs/go/*/go.mod

      - name: Add Go bin to PATH
        run: echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Install golangci-lint
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@latest

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.1.2

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Setup kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: v1.32.3

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting
        run: pnpm format:check

      - name: Check dev environment config
        run: pnpm dev:env:config-check

      - name: Check local gateway config
        run: pnpm gateway:config-check

      - name: Check TLS config
        run: pnpm tls:config-check

      - name: Check Sealed Secrets policy
        run: pnpm sealed-secrets:policy-check

      - name: Check Kubernetes manifests
        run: pnpm k8s:ci

      - name: Check health contract
        run: pnpm health:contract-check

      - name: Check migrations
        run: pnpm migrations:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck web
        run: pnpm typecheck:web

      - name: Test
        run: pnpm test

      - name: Test coverage
        run: pnpm test:coverage

      - name: Build
        run: pnpm build
