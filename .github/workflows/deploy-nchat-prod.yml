name: Deploy nchat-prod

# CICD-06: candidate and cutover, separated by a job boundary.
#
# The candidate half is fully automatable: it proves the release SHA, pins the
# images the sealed manifest names, brings the idle slot up with no traffic and
# runs the automated smoke. None of it can move production, because none of the
# scripts it calls patches a stable Service.
#
# The cutover half is one small protected job. It is the only place cutover.sh
# is reachable from, it runs under `environment: production`, and it starts only
# after a reviewer approves. While that approval is pending -- or if it is
# rejected, or the run is cancelled -- there is no execution path in this
# workflow that changes a stable Service selector.
#
# Between the two halves sits the authenticated release smoke, which is a person
# working through smoke.sh's checklist against the candidate's preview hosts.
# Approving the environment is how that person records the verdict; there is
# deliberately no input that could stand in for it.

on:
  workflow_dispatch:
    inputs:
      sha:
        description: Full 40-character lowercase commit SHA on main to promote.
        required: true
        type: string
      run_id:
        description: The "Build and push images" run that built and sealed this release.
        required: true
        type: string

permissions:
  contents: read

# One production release at a time, and never cancelled: a run waiting for its
# approval is holding a deployed candidate, and cancelling it silently would
# leave that candidate behind with nobody watching it.
concurrency:
  group: nchat-prod-deploy
  cancel-in-progress: false

jobs:
  # Everything that can be decided without a person. It ends with a candidate
  # that is Ready, isolated from production traffic, and smoked.
  candidate:
    runs-on: [self-hosted, linux, x64, nchat-prod-deploy]
    permissions:
      # actions: read is what lets this job read the sealed manifest of the
      # build run named in the dispatch. It carries no write of any kind.
      actions: read
      contents: read
    timeout-minutes: 45
    outputs:
      slot: ${{ steps.slot.outputs.slot }}
      release_id: ${{ steps.release.outputs.release_id }}
    steps:
      # Before anything else, and before the SHA reaches any command: a value
      # that is not a commit SHA never becomes an argument.
      - name: Validate the release request
        env:
          RELEASE_SHA: ${{ inputs.sha }}
          BUILD_RUN_ID: ${{ inputs.run_id }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_SHA" =~ ^[a-f0-9]{40}$ ]]
          [[ "$BUILD_RUN_ID" =~ ^[1-9][0-9]{0,18}$ ]]
          # A dispatch carries the workflow file of the ref it was started from.
          # The environment's deployment-branch rule is what actually enforces
          # this for the protected job; this makes the same refusal visible here,
          # before a candidate is deployed from an unreviewed pipeline.
          [[ "$GITHUB_REF" == "refs/heads/main" ]]
      # Full history: the ancestry of main has to be walked, not assumed.
      - name: Checkout the release commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Require a SHA reachable from main
        env:
          RELEASE_SHA: ${{ inputs.sha }}
        run: scripts/deploy/nchat-prod/require-main-sha.sh "$RELEASE_SHA"
      # The manifest, not the digests: it is sealed, it names the commit it was
      # built from, and it is retained for 90 days rather than 7.
      - name: Download the sealed release manifest
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-manifest
          path: release-manifest
          run-id: ${{ inputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Pin the release images from the manifest
        env:
          NCHAT_PROD_RELEASE_SHA: ${{ inputs.sha }}
        run: scripts/deploy/nchat-prod/release-digests.sh release-manifest artifacts
      # The identity of what is being released: the SHA-256 the manifest was
      # sealed with. A rebuild of the same commit seals a different manifest, so
      # this is the value that distinguishes two builds a commit cannot.
      - name: Read the release identity
        id: release
        run: echo "release_id=$(cat artifacts/release-id.txt)" >>"$GITHUB_OUTPUT"
      # Read before the deploy and reused by the smoke, so both halves of this
      # job talk about the same slot. deploy.sh derives it the same way from the
      # same cluster state, which a cutover cannot have changed: no job before
      # the protected one moves a stable Service.
      - name: Resolve the candidate slot
        id: slot
        run: |
          set -euo pipefail
          # shellcheck source=scripts/deploy/nchat-prod/lib.sh
          source scripts/deploy/nchat-prod/lib.sh
          slot="$(opposite_slot "$(resolve_active_slot "$(collect_service_slots)")")"
          echo "slot=$slot" >>"$GITHUB_OUTPUT"
      - name: Deploy the candidate slot
        env:
          ARTIFACTS_DIR: ${{ github.workspace }}/artifacts
          NCHAT_PROD_RELEASE_SHA: ${{ inputs.sha }}
          NCHAT_PROD_TOPOLOGY_FILE: ${{ vars.NCHAT_PROD_TOPOLOGY_FILE }}
          NCHAT_PROD_CAPACITY_EVIDENCE_DIR: ${{ vars.NCHAT_PROD_CAPACITY_EVIDENCE_DIR }}
          NCHAT_PROD_ASSUME_YES: "1"
        run: scripts/deploy/nchat-prod/deploy.sh
      # Fails the job on any automated check, which is what removes the cutover
      # job from the run: a skipped `needs` dependency is not a satisfied one.
      - name: Automated smoke
        env:
          CANDIDATE_SLOT: ${{ steps.slot.outputs.slot }}
        run: scripts/deploy/nchat-prod/smoke.sh --target "$CANDIDATE_SLOT"
      - name: Report what is still owed
        env:
          CANDIDATE_SLOT: ${{ steps.slot.outputs.slot }}
          RELEASE_SHA: ${{ inputs.sha }}
          RELEASE_ID: ${{ steps.release.outputs.release_id }}
        run: |
          echo "Candidate slot $CANDIDATE_SLOT carries release $RELEASE_SHA ($RELEASE_ID) and no production traffic."
          echo "Complete the authenticated release smoke printed above against the slot's"
          echo "preview hosts, record it in the release ticket, then approve the"
          echo "'production' environment to release the cutover job."

  # The only job in this repository that can move production traffic.
  #
  # It builds nothing, runs no migration, touches no Secret and no volume: it
  # re-proves the release and calls the canonical cutover, which applies its own
  # gates against the cluster as it is at this moment.
  cutover:
    needs: candidate
    environment: production
    runs-on: [self-hosted, linux, x64, nchat-prod-deploy]
    permissions:
      # actions: read so the promotion can fetch the sealed manifest and derive
      # the release identity itself. It refuses to take that identity from the
      # candidate's output alone: an output is a value this run computed, and
      # the point of the check is to catch a candidate that changed since.
      actions: read
      contents: read
    timeout-minutes: 20
    steps:
      - name: Validate the release request
        env:
          RELEASE_SHA: ${{ inputs.sha }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_SHA" =~ ^[a-f0-9]{40}$ ]]
          [[ "$GITHUB_REF" == "refs/heads/main" ]]
      - name: Checkout the release commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.sha }}
          fetch-depth: 0
          persist-credentials: false
      # Re-proved rather than inherited. main may have been rewritten while the
      # approval was pending, and the decision to promote is being taken now.
      - name: Require a SHA reachable from main
        env:
          RELEASE_SHA: ${{ inputs.sha }}
        run: scripts/deploy/nchat-prod/require-main-sha.sh "$RELEASE_SHA"
      # The same manifest the candidate pinned its digests from, fetched again
      # here so the promotion verifies the seal itself rather than inheriting a
      # verdict. Bound to the dispatched run id, exactly as the candidate was.
      - name: Download the sealed release manifest
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-manifest
          path: release-manifest
          run-id: ${{ inputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      # The evidence names the slot, the commit and the sealed release the
      # approval was given for. All three are asserted from this run's own
      # validated values, never read back from the cluster: cutover.sh recomputes
      # what the slot is actually carrying, re-derives the identity from the
      # manifest above, and refuses when any of them disagree. So a candidate
      # rebuilt or redeployed while the approval was pending -- same commit,
      # different bytes -- stops matching, and the stale approval cannot promote.
      - name: Cut production traffic over to the candidate
        env:
          CANDIDATE_SLOT: ${{ needs.candidate.outputs.slot }}
          NCHAT_PROD_SMOKE_CONFIRMED: ${{ needs.candidate.outputs.slot }}:${{ inputs.sha }}:${{ needs.candidate.outputs.release_id }}
          NCHAT_PROD_RELEASE_MANIFEST_DIR: ${{ github.workspace }}/release-manifest
          NCHAT_PROD_ASSUME_YES: "1"
        run: scripts/deploy/nchat-prod/cutover.sh --target "$CANDIDATE_SLOT"
