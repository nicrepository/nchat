name: Deploy nchat-prod

# The two halves of a Blue/Green release, as two jobs that cannot be confused
# with one another (CICD-05, CICD-07).
#
# `candidate` prepares the idle slot: it proves the release SHA, pins the images
# the sealed manifest names, brings the slot up with no traffic, runs the
# automated smoke, and proves it moved nothing. It cannot promote -- there is no
# step in it that reaches cutover.sh, switch_services_to_slot or a selector
# patch, and the stable-selector invariant it ends on fails the run if anything
# moved a Service while it ran.
#
# `cutover` promotes that exact candidate, and only after a human has approved
# the run in the `production` GitHub Environment. The approval is what records
# that the authenticated smoke of section 10 was performed and reviewed for this
# candidate:release; the workflow cannot perform that smoke and does not claim
# to. Nothing else about the release is decided here: the mutation itself is
# cutover.sh, which re-derives the release identity from the sealed manifest and
# re-checks the evidence against the cluster at the moment it runs.
#
# The two are separate jobs rather than two halves of one, because they are
# separated by a human. Everything `candidate` produced is a fact about a slot
# carrying no traffic; everything `cutover` does is production, gated on an
# approval that can arrive hours later. So `cutover` re-reads the cluster before
# it touches anything: the candidate could have been redeployed, rebuilt or
# degraded during the wait, and an approval of a release that is no longer on
# the slot authorises nothing.
#
# rollback.sh, drain-old.sh and the observation window stay outside this file.
# The old slot is left running by cutover.sh, and it is the rollback; retiring
# it is a separate, later decision in the operator runbook.

on:
  workflow_dispatch:
    inputs:
      sha:
        description: Full 40-character lowercase commit SHA on main to deploy as the candidate.
        required: true
        type: string
      run_id:
        description: The "Build and push images" run that built and sealed this release.
        required: true
        type: string

permissions:
  contents: read

# One production deploy at a time, and never cancelled: a run that is applying
# migrations or waiting on a rollout is holding a half-built candidate, and
# cancelling it silently would leave that candidate behind with nobody watching
# it. cancel-in-progress must be the boolean false -- the string "false" is
# truthy to the expression evaluator.
concurrency:
  group: nchat-prod-deploy
  cancel-in-progress: false

jobs:
  # The first job. It ends with a candidate that is Ready, isolated from
  # production traffic and smoked, and with the stable Services proved
  # untouched. It patches no Service.
  candidate:
    runs-on: [self-hosted, linux, x64, nchat-prod-deploy]
    # What the cutover job promotes, and nothing more: the slot this run built
    # and the seal of the manifest it built it from. Both are proved against the
    # cluster by this job's last two gates before they leave it, and re-proved
    # against the cluster by the cutover job before anything is patched.
    outputs:
      slot: ${{ steps.slot.outputs.slot }}
      release_id: ${{ steps.release.outputs.release_id }}
    permissions:
      # actions: read is what lets this job read the sealed manifest of the
      # build run named in the dispatch. It carries no write of any kind.
      actions: read
      contents: read
    timeout-minutes: 45
    steps:
      # Before anything else, and before the SHA reaches any command: a value
      # that is not a commit SHA never becomes an argument.
      - name: Validate the release request
        env:
          RELEASE_SHA: ${{ inputs.sha }}
          BUILD_RUN_ID: ${{ inputs.run_id }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_SHA" =~ ^[a-f0-9]{40}$ ]]
          [[ "$BUILD_RUN_ID" =~ ^[1-9][0-9]{0,18}$ ]]
          # A dispatch carries the workflow file of the ref it was started from,
          # so a feature branch would run its own copy of these gates. Refusing
          # here keeps a candidate from being deployed out of an unreviewed
          # pipeline; the runner's pre-job guard is the boundary behind it.
          [[ "$GITHUB_REF" == "refs/heads/main" ]]
      # Full history: the ancestry of main has to be walked, not assumed.
      - name: Checkout the release commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Require a SHA reachable from main
        env:
          RELEASE_SHA: ${{ inputs.sha }}
        run: scripts/deploy/nchat-prod/require-main-sha.sh "$RELEASE_SHA"
      # The manifest, not the digests: it is sealed, it names the commit it was
      # built from, and it is retained for 90 days rather than 7.
      - name: Download the sealed release manifest
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-manifest
          path: release-manifest
          run-id: ${{ inputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Pin the release images from the manifest
        env:
          NCHAT_PROD_RELEASE_SHA: ${{ inputs.sha }}
        run: scripts/deploy/nchat-prod/release-digests.sh release-manifest artifacts
      # The identity of what is being deployed: the SHA-256 the manifest was
      # sealed with. A rebuild of the same commit seals a different manifest, so
      # this is the value that distinguishes two builds a commit cannot.
      - name: Read the release identity
        id: release
        run: echo "release_id=$(cat artifacts/release-id.txt)" >>"$GITHUB_OUTPUT"
      # One read of the cluster, used for both things that depend on it: the
      # snapshot the invariant is proved against, and the slot the deploy goes
      # into. Taking them separately would leave a window in which the two
      # disagree, and the evidence would then be about a state no decision was
      # ever made from.
      #
      # The candidate is opposite_slot(active), derived from the cluster.
      # Nothing here reads a slot from an input, and neither blue nor green is
      # written down: a mixed or unknown state fails instead of being guessed.
      - name: Snapshot the stable Services and resolve the candidate slot
        id: slot
        env:
          SELECTORS_BEFORE: ${{ runner.temp }}/stable-selectors-before.txt
        run: |
          set -euo pipefail
          # shellcheck source=scripts/deploy/nchat-prod/lib.sh
          source scripts/deploy/nchat-prod/lib.sh
          mapping="$(collect_service_slots)"
          printf '%s\n' "$mapping" >"$SELECTORS_BEFORE"
          active="$(resolve_active_slot "$mapping")"
          echo "active=$active" >>"$GITHUB_OUTPUT"
          echo "slot=$(opposite_slot "$active")" >>"$GITHUB_OUTPUT"
          echo "stable Service selectors before the deploy:"
          cat "$SELECTORS_BEFORE"
      # Context, namespace, topology, capacity, migrations, apply and rollout,
      # in that order and each fail-closed. It patches no stable Service.
      - name: Deploy the candidate slot
        env:
          ARTIFACTS_DIR: ${{ github.workspace }}/artifacts
          # The slot resolved above, handed over rather than derived again.
          # deploy.sh revalidates it against the cluster and refuses if the
          # stable Services moved in between, so one decision drives the
          # deploy, the smoke, the selector proof and the evidence.
          NCHAT_PROD_CANDIDATE_SLOT: ${{ steps.slot.outputs.slot }}
          NCHAT_PROD_RELEASE_SHA: ${{ inputs.sha }}
          NCHAT_PROD_TOPOLOGY_FILE: ${{ vars.NCHAT_PROD_TOPOLOGY_FILE }}
          NCHAT_PROD_CAPACITY_EVIDENCE_DIR: ${{ vars.NCHAT_PROD_CAPACITY_EVIDENCE_DIR }}
          NCHAT_PROD_ASSUME_YES: "1"
        run: scripts/deploy/nchat-prod/deploy.sh
      # Fails the job on any automated check. It also proves the candidate is
      # isolated from production traffic and carries one consistent release.
      - name: Automated smoke
        env:
          CANDIDATE_SLOT: ${{ steps.slot.outputs.slot }}
        run: scripts/deploy/nchat-prod/smoke.sh --target "$CANDIDATE_SLOT"
      # The invariant, as evidence rather than as an argument: the same reader
      # that produced the snapshot, run again against the cluster, compared
      # exactly. A difference fails the run and is never repaired here -- this
      # step exists to detect that something moved production, and repairing it
      # would destroy the one record of that happening.
      - name: Prove the stable Services did not move
        env:
          SELECTORS_BEFORE: ${{ runner.temp }}/stable-selectors-before.txt
          SELECTORS_AFTER: ${{ runner.temp }}/stable-selectors-after.txt
        run: |
          set -euo pipefail
          # shellcheck source=scripts/deploy/nchat-prod/lib.sh
          source scripts/deploy/nchat-prod/lib.sh
          collect_service_slots >"$SELECTORS_AFTER"
          echo "stable Service selectors after the deploy:"
          cat "$SELECTORS_AFTER"
          diff -u "$SELECTORS_BEFORE" "$SELECTORS_AFTER"
          echo "The stable Services select exactly what they selected before this run."
      # The second invariant, and it is independent of the first. The selector
      # proof says production traffic did not move; this says the candidate was
      # not replaced underneath the run. A concurrent redeploy of the same slot
      # leaves the selectors untouched and produces a slot that is equally
      # Ready and equally CONSISTENT, so the smoke passes and only the identity
      # tells the two releases apart.
      #
      # Read from the cluster, as late as the run allows, and compared to the
      # release this run actually built: the dispatched commit and the seal of
      # the manifest its digests were pinned from. A rebuild of that same commit
      # carries a different seal and fails here.
      - name: Verify the candidate carries the release this run built
        env:
          CANDIDATE_SLOT: ${{ steps.slot.outputs.slot }}
          EXPECTED_RELEASE: ${{ inputs.sha }}:${{ steps.release.outputs.release_id }}
        run: |
          set -euo pipefail
          # shellcheck source=scripts/deploy/nchat-prod/lib.sh
          source scripts/deploy/nchat-prod/lib.sh
          require_slot_release_identity "$CANDIDATE_SLOT" "$EXPECTED_RELEASE"
          echo
          echo "Slot $CANDIDATE_SLOT is running exactly $EXPECTED_RELEASE."
      # Nothing above published a success, so both invariants are proved before
      # this run claims anything about the cluster.
      - name: Report what this run produced
        env:
          ACTIVE_SLOT: ${{ steps.slot.outputs.active }}
          CANDIDATE_SLOT: ${{ steps.slot.outputs.slot }}
          EXPECTED_RELEASE: ${{ inputs.sha }}:${{ steps.release.outputs.release_id }}
        run: |
          echo "Active slot   : $ACTIVE_SLOT, still serving every stable Service."
          echo "Candidate slot: $CANDIDATE_SLOT, verified against the cluster as running $EXPECTED_RELEASE, carrying no production traffic."
          echo "This job does not promote. The cutover job is next, and it starts only"
          echo "once a reviewer approves this run in the production environment."

  # The promotion, and the only place in this repository's automation where a
  # stable Service selector changes.
  #
  # It does not decide the promotion: it proves the cluster still matches what
  # was approved, hands cutover.sh an explicit target, and then proves the
  # result. Every gate that decides whether the traffic may move -- context,
  # namespace, readiness, one consistent release, the sealed manifest identity,
  # the smoke evidence, the mixed-state refusal, the read-back after each patch
  # -- lives in cutover.sh, where the operator procedure of runbook section 11
  # runs the same code down the same path. Restating any of them here would be a
  # second implementation of the gate, and two implementations of one gate is
  # one gate nobody maintains.
  cutover:
    needs: candidate
    # The human gate. A required reviewer on this GitHub Environment is what
    # holds the run between the automated smoke and the promotion, and approving
    # it is the record that the authenticated smoke of runbook section 10 was
    # performed and reviewed for exactly the candidate:release the job below
    # names. It is configured on the environment, not here: an approval rule
    # written in this file would be editable by the same change it gates.
    environment: production
    runs-on: [self-hosted, linux, x64, nchat-prod-deploy]
    permissions:
      # The same two the candidate job holds, and for the same reasons: the
      # sealed manifest is downloaded again here rather than carried over, so
      # the identity is re-derived from the artifact instead of from a value
      # that travelled through a job output.
      actions: read
      contents: read
    # Ten sequential patches, each read back, plus the readiness and identity
    # reads either side of them. Minutes, not tens of minutes -- and a limit at
    # all, because this run is holding the deploy concurrency group.
    timeout-minutes: 15
    steps:
      # `inputs.sha` reached this job only because the candidate job proved it
      # is a 40-character commit reachable from main, so it is not re-parsed
      # here. Reachability is re-proved, and that is not redundancy: an approval
      # can arrive hours later, and a commit main could reach then may have been
      # rewritten out of it since.
      - name: Checkout the release commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Require a SHA reachable from main
        env:
          RELEASE_SHA: ${{ inputs.sha }}
        run: scripts/deploy/nchat-prod/require-main-sha.sh "$RELEASE_SHA"
      # Downloaded again, into this job's own workspace, because cutover.sh
      # verifies the seal and recomputes the release id from it. A manifest
      # handed over as a job output would be a string a step could edit; an
      # artifact of the named build run is the same bytes the candidate pinned.
      - name: Download the sealed release manifest
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-manifest
          path: release-manifest
          run-id: ${{ inputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      # The state the promotion is decided from, read now rather than inherited
      # from before the approval, and classified against the target rather than
      # resolved into an active slot.
      #
      # Those are different questions and only the second one is answerable
      # here. A namespace split between blue and green is the normal shape of a
      # cutover to this same target that stopped part-way, and converging it is
      # exactly what a retry with the same `--target` is for; refusing every
      # mixed reading would close the one path that finishes it. What must fail
      # is a reading this cannot describe -- a Service selecting something that
      # is neither slot, one carrying no release-slot key, one that is not
      # there -- and require_promotable_selectors fails on each of those, before
      # anything is patched.
      #
      # The rollback target is `opposite_slot(target)` and nothing else. Reading
      # it back from the selectors would name the target itself once the
      # namespace has already converged on it, which is the one slot a rollback
      # can never go to.
      - name: Read and classify the stable Services before the cutover
        id: before
        env:
          TARGET_SLOT: ${{ needs.candidate.outputs.slot }}
          SELECTORS_BEFORE: ${{ runner.temp }}/stable-selectors-before.txt
        run: |
          set -euo pipefail
          # shellcheck source=scripts/deploy/nchat-prod/lib.sh
          source scripts/deploy/nchat-prod/lib.sh
          mapping="$(collect_service_slots)"
          printf '%s\n' "$mapping" >"$SELECTORS_BEFORE"
          echo "stable Service selectors before the cutover:"
          cat "$SELECTORS_BEFORE"
          require_promotable_selectors "$mapping" "$TARGET_SLOT"
          rollback_target="$(opposite_slot "$TARGET_SLOT")"
          echo "rollback_target=$rollback_target" >>"$GITHUB_OUTPUT"
          echo "Every stable Service selects $TARGET_SLOT or $rollback_target."
      # The candidate the approval was given for, checked against the cluster as
      # it is now. The smoke, the approval and this run are three moments, and a
      # redeploy or a rebuild in any of the gaps leaves a slot that is equally
      # Ready and equally consistent while carrying something nobody validated.
      # Only the identity separates them, so it is read here and compared before
      # the evidence built from it is handed to cutover.sh.
      - name: Revalidate the approved candidate against the cluster
        env:
          CANDIDATE_SLOT: ${{ needs.candidate.outputs.slot }}
          EXPECTED_RELEASE: ${{ inputs.sha }}:${{ needs.candidate.outputs.release_id }}
        run: |
          set -euo pipefail
          # shellcheck source=scripts/deploy/nchat-prod/lib.sh
          source scripts/deploy/nchat-prod/lib.sh
          require_slot_release_identity "$CANDIDATE_SLOT" "$EXPECTED_RELEASE"
          echo
          echo "Slot $CANDIDATE_SLOT still carries exactly $EXPECTED_RELEASE."
      # The mutation, and the only one. The target is named, so a retry after a
      # partial failure converges to the same slot instead of reversing; the
      # evidence names the slot and the release together, so an approval cannot
      # be replayed against a candidate that has changed; and cutover.sh
      # recomputes that expectation from the cluster itself, so the token built
      # here is checked rather than believed.
      - name: Cut production traffic over to the approved candidate
        id: promote
        env:
          CANDIDATE_SLOT: ${{ needs.candidate.outputs.slot }}
          NCHAT_PROD_SMOKE_CONFIRMED: ${{ needs.candidate.outputs.slot }}:${{ inputs.sha }}:${{ needs.candidate.outputs.release_id }}
          NCHAT_PROD_RELEASE_MANIFEST_DIR: release-manifest
          NCHAT_PROD_ASSUME_YES: "1"
        run: scripts/deploy/nchat-prod/cutover.sh --target "$CANDIDATE_SLOT"
      # Recording what the cutover left behind, separately from judging it, and
      # the separation is the point: a cutover that stops part-way is the run
      # whose after-state matters most, and it is exactly the run in which a
      # single asserting step would never execute. So this one reads and prints,
      # it asserts nothing, and it runs whenever the promotion was reached at
      # all -- success or failure.
      #
      # It cannot turn a failure into a success: the promotion step above keeps
      # its own status, this step carries no continue-on-error, and the proof
      # below is an ordinary step that stays skipped when the promotion failed.
      #
      # The condition is an allowlist of the two conclusions that mean the
      # promotion actually ran, and it has to be: naming a status function at
      # all stops Actions inserting the implicit `success()`, so a looser test
      # would run this step in cases where nothing was promoted. `conclusion !=
      # ''` is the one to avoid -- a step skipped because an earlier one failed
      # reports `skipped`, which is not the empty string, so that spelling sends
      # a run that never reached the promotion to query production anyway.
      # `!cancelled()` keeps a cancelled run off the cluster as well.
      #
      # Read-only, and only through collect_service_slots. It repairs nothing
      # and rolls nothing back: the mixed state it may be recording is the only
      # evidence of what happened, and the operator procedure in section 12 of
      # the runbook is what acts on it.
      - name: Record the stable Services after the cutover
        if: ${{ !cancelled() && (steps.promote.conclusion == 'success' || steps.promote.conclusion == 'failure') }}
        env:
          SELECTORS_AFTER: ${{ runner.temp }}/stable-selectors-after.txt
        run: |
          set -euo pipefail
          # shellcheck source=scripts/deploy/nchat-prod/lib.sh
          source scripts/deploy/nchat-prod/lib.sh
          collect_service_slots >"$SELECTORS_AFTER"
          echo "stable Service selectors after the cutover:"
          cat "$SELECTORS_AFTER"
      # Total convergence, proved from the recording above. An ordinary step, so
      # a failed promotion never reaches it and no success is claimed for one.
      # `all_services_on_slot` is true only when every stable Service reports
      # exactly the target: a Service that is missing, carries no release-slot
      # key, kept the old slot or holds an unexpected value all read as a
      # distinct value and fail here. Partial success has no spelling that passes.
      - name: Prove every stable Service converged on the promoted slot
        env:
          CANDIDATE_SLOT: ${{ needs.candidate.outputs.slot }}
          SELECTORS_AFTER: ${{ runner.temp }}/stable-selectors-after.txt
        run: |
          set -euo pipefail
          # shellcheck source=scripts/deploy/nchat-prod/lib.sh
          source scripts/deploy/nchat-prod/lib.sh
          all_services_on_slot "$(cat "$SELECTORS_AFTER")" "$CANDIDATE_SLOT"
          echo "Every stable Service selects slot $CANDIDATE_SLOT."
      # Convergence is about selectors; it says nothing about what the slot they
      # now point at is running. A slot that degraded or was redeployed during
      # the patches would satisfy the step above and still be serving something
      # other than the approved release, so the identity is read once more,
      # after the traffic has moved.
      - name: Prove the promoted slot still carries the approved release
        env:
          CANDIDATE_SLOT: ${{ needs.candidate.outputs.slot }}
          EXPECTED_RELEASE: ${{ inputs.sha }}:${{ needs.candidate.outputs.release_id }}
        run: |
          set -euo pipefail
          # shellcheck source=scripts/deploy/nchat-prod/lib.sh
          source scripts/deploy/nchat-prod/lib.sh
          require_slot_release_identity "$CANDIDATE_SLOT" "$EXPECTED_RELEASE"
          echo
          echo "Production serves $EXPECTED_RELEASE on slot $CANDIDATE_SLOT."
      # Last, so nothing above published a success before both proofs passed.
      # The rollback slot is opposite_slot(target), resolved in the preflight
      # from the authorised target and never from the selectors: once the
      # namespace has converged, the selectors name the target itself, which is
      # the one slot a rollback can never go to. It is still running and
      # untouched; nothing here rolls back, and nothing here drains it.
      - name: Report the promotion
        env:
          ROLLBACK_SLOT: ${{ steps.before.outputs.rollback_target }}
          CANDIDATE_SLOT: ${{ needs.candidate.outputs.slot }}
          EXPECTED_RELEASE: ${{ inputs.sha }}:${{ needs.candidate.outputs.release_id }}
        run: |
          echo "Promoted slot : $CANDIDATE_SLOT, serving every stable Service as $EXPECTED_RELEASE."
          echo "Rollback slot : $ROLLBACK_SLOT, still running and untouched. It is the rollback target."
          echo "Roll back with: scripts/deploy/nchat-prod/rollback.sh --target $ROLLBACK_SLOT '<reason>'"
          echo "Observe before retiring the previous slot; see sections 13 to 16 of"
          echo "docs/runbooks/production-blue-green-deployment.md."
