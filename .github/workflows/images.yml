name: Build and push images

# Callers of the single builder. A push to develop builds the commit that was
# pushed; a manual dispatch builds an approved production SHA, which the builder
# refuses unless main can reach it.
#
# The builder only builds. Sealing the release and deploying to nchat-dev are
# two independent consumers of that build, so a manifest that cannot be written
# does not hold back a development deploy whose images already exist.

on:
  push:
    branches: [develop]
  workflow_dispatch:
    inputs:
      sha:
        description: Full 40-character lowercase commit SHA on main to build.
        required: true
        type: string

permissions:
  actions: read
  contents: read

# A production release is keyed by the commit it builds, and is never cancelled
# by a later dispatch: the digests of a run are the identity of that release.
concurrency:
  group: nchat-images-${{ github.event_name == 'workflow_dispatch' && inputs.sha || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

jobs:
  build:
    permissions:
      actions: read
      contents: read
      packages: write
    uses: ./.github/workflows/build-nchat-images.yml
    with:
      sha: ${{ github.event_name == 'workflow_dispatch' && inputs.sha || github.sha }}
      require_main: ${{ github.event_name == 'workflow_dispatch' }}

  # CICD-04: the identity of a release, written once from the digests this run
  # produced and sealed with a SHA-256. It needs no registry write and no token
  # beyond reading this run's own artifacts.
  release-manifest:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          # The commit the builder reported building, never a ref of the
          # caller's own: a dispatch builds a SHA that is not this run's HEAD.
          ref: ${{ needs.build.outputs.sha }}
          persist-credentials: false
      # Without run-id/github-token this reads only the current run's artifacts,
      # which is what makes the eleven digests provably one build.
      - name: Download image digests
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: digest-*
          path: release-digests
          merge-multiple: true
      - name: Generate release manifest
        env:
          NCHAT_RELEASE_SOURCE_SHA: ${{ needs.build.outputs.sha }}
          NCHAT_RELEASE_RUN_ID: ${{ github.run_id }}
        run: scripts/deploy/nchat-prod/release-manifest.sh release-digests release-manifest
      # 90 days: the longest retention every GitHub plan honours, and an order
      # of magnitude past the 7-day digest artifacts this is distilled from.
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-manifest
          path: |
            release-manifest/release-manifest.json
            release-manifest/release-manifest.sha256
          retention-days: 90
          if-no-files-found: error

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    needs: build
    permissions:
      actions: read
      contents: read
    uses: ./.github/workflows/deploy-nchat-dev.yml
    with:
      sha: ${{ github.sha }}
