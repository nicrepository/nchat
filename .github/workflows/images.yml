name: Build and push images

on:
  push:
    branches: [develop]
  workflow_dispatch:
    inputs:
      sha:
        description: "Target SHA to rebuild and deploy"
        required: true
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: nchat-dev-images-${{ github.ref }}
  cancel-in-progress: true

jobs:
  inventory:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      images: ${{ steps.images.outputs.images }}
    steps:
      - name: Validate manual dispatch
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        env:
          INPUT_SHA: ${{ inputs.sha }}
        run: |
          if [ "$GITHUB_REF" != "refs/heads/develop" ]; then
            echo "Error: Must run on develop"
            exit 1
          fi
          if ! [[ "$INPUT_SHA" =~ ^[a-f0-9]{40}$ ]]; then
            echo "Error: Invalid SHA format"
            exit 1
          fi
          if [ "$INPUT_SHA" != "$GITHUB_SHA" ]; then
            echo "Error: Input SHA must match current branch tip ($GITHUB_SHA)"
            exit 1
          fi
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.sha || github.sha }}
      - id: images
        run: scripts/deploy/nchat-dev/image-matrix.sh >> "$GITHUB_OUTPUT"

  build:
    needs: inventory
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        image: ${{ fromJSON(needs.inventory.outputs.images) }}
    steps:
      # actions/checkout v4.2.2
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ inputs.sha || github.sha }}
      # docker/setup-buildx-action v3.11.1
      - uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435
      # docker/login-action v3.3.0
      - uses: docker/login-action@9780b0c442fbb1117ed29e0efdff1e18412f7567
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Select build
        id: build
        shell: bash
        env:
          IMAGE: ${{ matrix.image }}
        run: |
          set -euo pipefail
          case "$IMAGE" in
            web) dockerfile=Dockerfile.web; build_args= ;;
            admin-web) dockerfile=Dockerfile.admin-web; build_args= ;;
            migrations) dockerfile=Dockerfile.migrations; build_args= ;;
            document-converter) dockerfile=Dockerfile.document-converter; build_args= ;;
            *) dockerfile=Dockerfile.service; build_args="SERVICE=$IMAGE" ;;
          esac
          echo "dockerfile=$dockerfile" >> "$GITHUB_OUTPUT"
          echo "build_args=$build_args" >> "$GITHUB_OUTPUT"
      - name: Build and push
        id: push
        # docker/build-push-action v6.18.0
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83
        with:
          context: .
          file: ${{ steps.build.outputs.dockerfile }}
          build-args: ${{ steps.build.outputs.build_args }}
          push: true
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=nchat-${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=nchat-${{ matrix.image }}
          tags: ghcr.io/nicrepository/nchat/${{ matrix.image }}:${{ inputs.sha || github.sha }}
      - name: Record digest
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
          IMAGE: ${{ matrix.image }}
        run: printf '%s' "$DIGEST" > "digest-$IMAGE.txt"
      # actions/upload-artifact v4.6.2
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: digest-${{ matrix.image }}
          path: digest-${{ matrix.image }}.txt
          retention-days: 7

  deploy:
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/develop'
    needs: build
    permissions:
      actions: read
      contents: read
    uses: ./.github/workflows/deploy-nchat-dev.yml
    with:
      sha: ${{ inputs.sha || github.sha }}
