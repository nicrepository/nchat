name: Deploy nchat-dev

# The nchat-dev half of continuous delivery: apply, prove, report (issue #933).
#
# Called by cd-develop.yml with a commit `CI / Required` has already passed.
# It holds no eligibility rule of its own -- the caller decided that -- and it
# holds no Kubernetes logic of its own either: gitops-publish.sh writes the
# release into the infrastructure repository, flux-wait.sh asks the Git server
# what Flux made of it, and this file wires them together and publishes what
# happened.
#
# Since the migration off srv-apps-01, nchat-dev runs on a k3s cluster that Flux
# reconciles from that repository: no runner reaches the cluster's API. Flux applies the release's migrations Job first, waits for it, and only
# then the images (the order deploy.sh used); its health checks take the place
# of the rollout and migration checks this job used to run with kubectl.
#
# Publish and wait are two steps rather than one because they answer different
# questions. A failed publish means the release never reached the repository;
# a failed wait means Flux did not bring it up healthy. An operator
# reading the summary needs to know which, and neither may be reported as
# success.

on:
  workflow_call:
    inputs:
      sha:
        required: true
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: nchat-dev-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04
    environment: nchat-dev
    timeout-minutes: 20
    steps:
      - name: Validate deployment SHA
        env:
          DEPLOY_SHA: ${{ inputs.sha }}
        run: '[[ "$DEPLOY_SHA" =~ ^[a-f0-9]{40}$ ]]'
      - name: Checkout approved commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.sha }}
      - name: Download image digests
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: digest-*
          path: artifacts
          merge-multiple: true
      - name: Install verified Kustomize
        run: scripts/deploy/nchat-dev/install-kustomize.sh
      - name: Test deployment helpers
        env:
          NCHAT_DEV_NODE_IP: ${{ vars.NCHAT_DEV_NODE_IP }}
          NCHAT_DEV_NODE_CIDR: ${{ vars.NCHAT_DEV_NODE_CIDR }}
          NCHAT_DEV_HOST: ${{ vars.NCHAT_DEV_HOST }}
          NCHAT_DEV_TURN_EXTERNAL_IP: ${{ vars.NCHAT_DEV_TURN_EXTERNAL_IP }}
        run: scripts/ci/nchat-dev-deployment-check.sh
      # The repository URL is a variable and the token (write_repository on that
      # repository only) a secret, both of the nchat-dev environment.
      - name: Publish the release to the infrastructure repository
        id: apply
        env:
          ARTIFACTS_DIR: ${{ github.workspace }}/artifacts
          DEPLOY_SHA: ${{ inputs.sha }}
          K3S_DEV_REPOSITORY: ${{ vars.K3S_DEV_REPOSITORY }}
          K3S_DEV_TOKEN: ${{ secrets.K3S_DEV_DEPLOY_TOKEN }}
        run: scripts/deploy/nchat-dev/gitops-publish.sh >>"$GITHUB_OUTPUT"
      # Publishing is not delivery. Flux writes a commit status per
      # Kustomization once it has applied the commit and its health checks
      # passed -- the migrations Job completed, then every rollout Ready -- and
      # this waits for both on the commit that carries the release. nchat-dev
      # accepts only the internal network, so its public surface is no longer
      # something a hosted runner can ask (it answers 403); the Git server is
      # the view of the cluster this job has. The token is read_api on that
      # repository only, a secret of the nchat-dev environment.
      - name: Wait for Flux to bring the release up
        id: flux
        env:
          K3S_DEV_REPOSITORY: ${{ vars.K3S_DEV_REPOSITORY }}
          INFRA_COMMIT: ${{ steps.apply.outputs.commit }}
          FLUX_STATUS_TOKEN: ${{ secrets.K3S_DEV_STATUS_TOKEN }}
          # The CDN in front of the Git server refuses API reads from hosted
          # runners (403); the address reaches the server itself, by name.
          FLUX_GIT_SERVER_ADDRESS: ${{ vars.K3S_DEV_GIT_SERVER_ADDRESS }}
        run: scripts/deploy/flux-wait.sh "$K3S_DEV_REPOSITORY" "$INFRA_COMMIT" nchat-dev/producao-migracoes nchat-dev/producao
      # Last, and it reports rather than decides: every step above keeps its
      # own status, this one adds no `continue-on-error`, and a failed publish
      # or wait has already failed the job by the time it runs.
      #
      # `!cancelled()` rather than `always()`: naming a status function at all
      # stops Actions inserting the implicit `success()`, and a cancelled run
      # has nothing to report.
      - name: Publish the deployment summary
        if: ${{ !cancelled() }}
        env:
          DEPLOY_SHA: ${{ inputs.sha }}
          APPLY_RESULT: ${{ steps.apply.conclusion }}
          FLUX_RESULT: ${{ steps.flux.conclusion }}
          DIGEST_DIR: ${{ github.workspace }}/artifacts
        run: |
          set -euo pipefail
          {
            echo "## CD / Develop"
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| SHA | \`$DEPLOY_SHA\` |"
            echo "| Images | $(find "$DIGEST_DIR" -name 'digest-*.txt' -type f | wc -l) pinned by OCI digest |"
            echo "| Published for Flux (migrations, then images) | ${APPLY_RESULT:-not reached} |"
            echo "| Migrated and healthy (Flux) | ${FLUX_RESULT:-not reached} |"
            echo
            echo "Single-slot deployment; no Blue/Green and no traffic switch in this environment."
          } >>"$GITHUB_STEP_SUMMARY"
