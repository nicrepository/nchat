name: Governance

on:
  pull_request:
    branches:
      - main
      - develop
  push:
    branches:
      - develop
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  governance:
    name: Repository governance
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Test Git conventions checker
        run: python3 -m unittest scripts/ci/test_git_conventions_check.py

      - name: Check Git conventions
        if: github.event_name == 'pull_request'
        env:
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: python3 scripts/ci/git-conventions-check.py

      - name: Check mandatory files
        shell: bash
        run: |
          set -euo pipefail
          required_files=(
            "README.md"
            "CONTRIBUTING.md"
            "SECURITY.md"
            ".github/pull_request_template.md"
            ".github/CODEOWNERS"
          )

          for file in "${required_files[@]}"; do
            if [ ! -f "$file" ]; then
              echo "Missing required file: $file"
              exit 1
            fi
          done

      - name: Check no committed env files
        shell: bash
        run: |
          set -euo pipefail
          if git ls-files | grep -E '(^|/)\.env$'; then
            echo "Committed .env files are not allowed."
            exit 1
          fi

      - name: Check obvious secret markers
        run: python3 scripts/ci/governance-secret-markers-check.py
