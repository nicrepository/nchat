name: Backend

on:
  pull_request:
    branches:
      - main
      - develop
  push:
    branches:
      - main
      - develop
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25.11"
          cache-dependency-path: |
            services/*/go.mod
            libs/go/*/go.mod

      - name: Add Go bin to PATH
        run: echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Check formatting
        run: bash scripts/ci/go-fmt-check.sh

      - name: Vet
        run: bash scripts/ci/go-vet.sh

      - name: Test
        run: bash scripts/ci/go-test.sh

      - name: Test coverage
        run: bash scripts/ci/go-coverage-check.sh

      - name: Install golangci-lint
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@latest

      - name: Lint
        run: bash scripts/ci/go-lint.sh
