name: Backend

on:
  pull_request:
  push:
    branches:
      - main
      - develop

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25.10"
          cache-dependency-path: |
            services/*/go.sum
            libs/go/*/go.sum

      - name: Add Go bin to PATH
        run: echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Check formatting
        run: bash scripts/ci/go-fmt-check.sh

      - name: Vet
        run: bash scripts/ci/go-vet.sh

      - name: Test
        run: bash scripts/ci/go-test.sh

      - name: Install golangci-lint
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@latest

      - name: Lint
        run: bash scripts/ci/go-lint.sh
