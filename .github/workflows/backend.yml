name: Backend

on:
  pull_request:
    branches:
      - main
      - develop
  push:
    branches:
      - main
      - develop
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    runs-on: ubuntu-latest
    # The RF-21 Link Safety tests only run against a real PostgreSQL, and the
    # coverage gate merges their profile in. Ephemeral, local to this job, and
    # named *_test because the suites refuse any other database.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: nchat
          POSTGRES_PASSWORD: REPLACE_ME
          POSTGRES_DB: nchat_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nchat -d nchat_test"
          --health-interval 10s --health-timeout 5s --health-retries 10
    env:
      # Read only by scripts/ci/go-coverage-check.sh. Deliberately not
      # CHAT_TEST_DATABASE_URL or FILE_TEST_DATABASE_URL, so the ordinary test
      # and race steps keep skipping every opt-in PostgreSQL suite.
      LINK_SAFETY_TEST_DATABASE_URL: postgresql://nchat:REPLACE_ME@localhost:5432/nchat_test?sslmode=disable
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25.13"
          cache-dependency-path: |
            services/*/go.mod
            libs/go/*/go.mod

      - name: Add Go bin to PATH
        run: echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Check formatting
        run: bash scripts/ci/go-fmt-check.sh

      - name: Vet
        run: bash scripts/ci/go-vet.sh

      - name: Test
        run: bash scripts/ci/go-test.sh

      - name: Run Go race tests
        run: bash scripts/ci/go-test.sh -race

      # The RF-21 suites read the schema the real migrations produce, across both
      # the chat and files domains, so the official runner applies them rather
      # than a simplified copy maintained here.
      - name: Apply migrations to the coverage database
        run: bash scripts/db/migrate.sh up
        env:
          MIGRATIONS_DATABASE_URL: ${{ env.LINK_SAFETY_TEST_DATABASE_URL }}

      - name: Test coverage
        run: bash scripts/ci/go-coverage-check.sh

      - name: Install golangci-lint
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@latest

      - name: Lint
        run: bash scripts/ci/go-lint.sh
