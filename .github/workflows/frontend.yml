name: Frontend

on:
  pull_request:
    branches:
      - main
      - develop
  push:
    branches:
      - main
      - develop
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.1.2

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Check web formatting
        run: pnpm format:check:web

      - name: Lint web
        run: pnpm lint:web

      - name: Typecheck web
        run: pnpm typecheck:web

      - name: Test web
        run: pnpm test:web

      - name: Test web E2E
        run: pnpm test:e2e:web

      - name: Test web coverage
        run: pnpm test:coverage:web

      - name: Build web
        run: pnpm build:web
