version: "2"

run:
  timeout: 5m
  tests: true
  modules-download-mode: readonly

output:
  formats:
    text:
      path: stdout
      colors: true

linters:
  enable:
    - govet
    - staticcheck
    - ineffassign
    - errcheck
    - misspell
    - unconvert
    - unused
    - bodyclose
    - gocritic
    - gosec
    - revive
  settings:
    revive:
      severity: warning
      rules:
        - name: exported
          disabled: true
    gosec:
      excludes:
        - G104

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
