<main class="flex-grow flex items-center justify-center">
<div class="bg-surface-container-lowest border border-outline-variant/30 rounded-xl shadow-[0_4px_24px_-8px_rgba(123,47,227,0.08)] w-full max-w-[440px] p-xl overflow-hidden relative z-10">
<div class="mb-lg text-center">
<img alt="NIC-Labs Logo" class="h-16 w-auto mx-auto mb-md object-contain" src="https://lh3.googleusercontent.com/aida-public/AB6AXuBCI2oXQrtG5VrPq52a_oXMVN2x4HuaNN644eZo8osKFIDV6yvFmpruqg3j_xGCBqqJyw8AsiGNcvX74jX6O6Q8ItM1ViB-ccpdJ6x7F37S3jOWMoK5COoM-7yiQ6iyj4OcPDJ89R_xp3tCX7GqZH7zwKhxFrA7uB0Cbhww2tIFCMVQCMEg6qX52W96xPmjQ68uTnpDJsDRnCGjn4VXz8oOiy4y8uvsIpGXjtdlerqxMS4sQEV2aaihK2FL_ORvtV02pqZdTggmUZQJ"/>
<h1 class="font-headline-md text-headline-md text-on-surface mb-xs">Entrar no NIC Chat</h1>
<p class="font-body-sm text-body-sm text-on-surface-variant">Comunicação interna segura para equipes NIC-Labs</p>
</div>
<form class="space-y-md">
<div class="space-y-xs">
<label class="font-label-md text-label-md text-on-surface-variant block" for="email">E-mail corporativo</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-sm top-1/2 -translate-y-1/2 text-outline">mail</span>
<input class="w-full bg-surface border border-outline-variant rounded-lg py-sm pl-xl pr-sm font-body-sm text-body-sm text-on-surface focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-colors" id="email" name="email" placeholder="nome@nic-labs.com" type="email"/>
</div>
</div>
<div class="space-y-xs">
<label class="font-label-md text-label-md text-on-surface-variant block" for="password">Senha</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-sm top-1/2 -translate-y-1/2 text-outline">lock</span>
<input class="w-full bg-surface border border-outline-variant rounded-lg py-sm pl-xl pr-sm font-body-sm text-body-sm text-on-surface focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-colors" id="password" name="password" placeholder="••••••••" type="password"/>
</div>
</div>
<div class="flex items-center">
<input class="h-4 w-4 text-primary focus:ring-primary border-outline rounded bg-surface transition-colors cursor-pointer" id="remember_me" name="remember_me" type="checkbox"/>
<label class="ml-sm block font-body-sm text-body-sm text-on-surface-variant cursor-pointer" for="remember_me">
                        Manter conectado neste dispositivo
                    </label>
</div>
<div class="pt-sm space-y-sm">
<button class="w-full bg-[#7B2FE3] text-white font-label-md text-label-md rounded-lg py-sm px-md flex items-center justify-center hover:opacity-90 transition-opacity duration-200" type="submit">
                        Entrar
                    </button>
<button class="w-full border border-[#7B2FE3] text-[#7B2FE3] bg-transparent font-label-md text-label-md rounded-lg py-sm px-md flex items-center justify-center hover:bg-surface-container transition-colors duration-200" type="button">
                        Entrar com SSO
                    </button>
</div>
<div class="text-center pt-md">
<a class="font-label-md text-label-md text-[#7B2FE3] hover:opacity-80 transition-opacity" href="#">Esqueci minha senha</a>
</div>
</form>
</div>
</main>
<footer class="mt-auto text-center pt-lg">
<p class="font-label-md text-label-md text-on-surface-variant/70">NIC-Labs · Plataforma interna</p>
</footer>
