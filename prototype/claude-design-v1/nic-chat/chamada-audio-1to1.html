<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<title>NIC Chat — Chamada com Juliane Lino</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet" />
<link rel="stylesheet" href="tokens.css" />
<style>
  html, body { height: 100%; margin: 0; overflow: hidden; }
  body {
    background: #0F0D17;
    font-family: var(--font-sans);
    display: flex; flex-direction: row;
    -webkit-font-smoothing: antialiased;
  }

  /* ── Main area ──────────────────────────── */
  .call-main {
    flex: 1; min-width: 0;
    display: flex; flex-direction: column;
  }

  /* ── Header ─────────────────────────────── */
  .call-header {
    display: flex; align-items: center;
    padding: 16px 24px;
    gap: 12px; flex-shrink: 0;
  }
  .call-header__logo {
    display: flex; align-items: center; gap: 8px; text-decoration: none;
  }
  .call-header__mark {
    width: 28px; height: 28px; border-radius: 6px;
    background: rgba(168,101,247,0.18);
    border: 1px solid rgba(168,101,247,0.3);
    display: flex; align-items: center; justify-content: center; overflow: hidden;
  }
  .call-header__mark img { width: 18px; height: 18px; object-fit: contain; }
  .call-header__name { font-size: 13px; font-weight: 700; color: rgba(255,255,255,0.65); }
  .call-header__back {
    margin-left: auto;
    background: rgba(255,255,255,0.07);
    border: 1px solid rgba(255,255,255,0.10);
    color: rgba(255,255,255,0.7);
    padding: 6px 14px; border-radius: 20px;
    font-size: 13px; font-weight: 600;
    display: flex; align-items: center; gap: 6px;
    cursor: pointer; text-decoration: none;
  }
  .call-header__back:hover { background: rgba(255,255,255,0.13); color: #fff; }

  /* ── Stage ───────────────────────────────── */
  .call-stage {
    flex: 1;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    gap: 0; position: relative;
  }

  /* Speaking ring — pure CSS, no icon needed */
  .avatar-ring {
    position: relative;
    display: flex; align-items: center; justify-content: center;
    margin-bottom: 24px;
  }
  .avatar-ring__outer {
    position: absolute;
    width: 160px; height: 160px;
    border-radius: 50%;
    border: 2px solid rgba(74, 222, 128, 0.55);
    animation: ringpulse 2s ease-out infinite;
  }
  .avatar-ring__outer:nth-child(2) { animation-delay: 0.65s; }
  .avatar-ring__outer:nth-child(3) { animation-delay: 1.3s; }
  @keyframes ringpulse {
    0%   { transform: scale(0.85); opacity: 0.75; }
    100% { transform: scale(1.55); opacity: 0; }
  }
  .avatar-ring__face {
    width: 120px; height: 120px; border-radius: 50%;
    background: linear-gradient(135deg, #DB2777, #F472B6);
    display: flex; align-items: center; justify-content: center;
    font-size: 40px; font-weight: 700; color: #fff;
    border: 3px solid rgba(74,222,128,0.6);
    box-shadow: 0 0 0 5px rgba(74,222,128,0.15);
    position: relative; z-index: 1;
    user-select: none;
  }
  .call-name {
    font-size: 24px; font-weight: 700; color: #fff;
    margin: 0 0 5px; letter-spacing: -0.01em;
  }
  .call-role {
    font-size: 14px; color: rgba(255,255,255,0.45);
    margin: 0 0 18px;
  }
  .call-status {
    display: flex; align-items: center; gap: 8px;
    font-size: 14px; font-weight: 600;
    color: #4ADE80; margin-bottom: 44px;
  }
  .call-status__dot {
    width: 7px; height: 7px; border-radius: 50%;
    background: #4ADE80; animation: blink 1.4s infinite;
  }
  @keyframes blink { 0%,100%{opacity:1;}50%{opacity:0.25;} }
  .call-timer { color: rgba(255,255,255,0.45); font-weight: 400; }

  /* Volume bars */
  .vol-bars {
    display: inline-flex; align-items: flex-end; gap: 2.5px; height: 16px;
  }
  .vol-bars span {
    width: 3px; border-radius: 2px; background: #4ADE80;
    animation: volbar 1.1s ease-in-out infinite;
  }
  .vol-bars span:nth-child(1){height:30%;animation-delay:0s}
  .vol-bars span:nth-child(2){height:80%;animation-delay:.13s}
  .vol-bars span:nth-child(3){height:55%;animation-delay:.26s}
  .vol-bars span:nth-child(4){height:90%;animation-delay:.39s}
  .vol-bars span:nth-child(5){height:40%;animation-delay:.52s}
  @keyframes volbar{0%,100%{transform:scaleY(0.45)}50%{transform:scaleY(1)}}

  /* Self bubble */
  .self-bubble {
    position: absolute; bottom: 24px; right: 24px;
    width: 70px; height: 70px; border-radius: 50%;
    background: linear-gradient(135deg, #7B43E8, #B485F4);
    display: flex; align-items: center; justify-content: center;
    font-size: 20px; font-weight: 700; color: #fff;
    border: 3px solid rgba(255,255,255,0.1);
    box-shadow: 0 4px 20px rgba(0,0,0,0.5);
    z-index: 3; user-select: none;
  }
  .self-bubble__label {
    position: absolute; bottom: -18px; left: 50%; transform: translateX(-50%);
    font-size: 11px; color: rgba(255,255,255,0.45); white-space: nowrap;
    font-family: var(--font-sans);
  }
  .self-muted {
    position: absolute; top: -4px; right: -4px;
    width: 22px; height: 22px; border-radius: 50%;
    background: #EF4444; border: 2px solid #0F0D17;
    display: flex; align-items: center; justify-content: center;
  }
  .self-muted .material-symbols-outlined { font-size: 12px; color: #fff; }

  /* ── Controls ────────────────────────────── */
  .call-controls {
    padding: 0 24px 36px;
    display: flex; align-items: center; justify-content: center;
    gap: 20px; flex-shrink: 0;
  }
  .ctrl-btn {
    display: flex; flex-direction: column; align-items: center; gap: 7px;
    cursor: pointer; background: none; border: none; min-width: 64px;
  }
  .ctrl-btn__icon {
    width: 56px; height: 56px; border-radius: 50%;
    background: rgba(255,255,255,0.10);
    border: 1px solid rgba(255,255,255,0.08);
    display: flex; align-items: center; justify-content: center;
    color: #fff; transition: background .15s;
    flex-shrink: 0;
  }
  .ctrl-btn__icon .material-symbols-outlined { font-size: 22px; }
  .ctrl-btn:hover .ctrl-btn__icon { background: rgba(255,255,255,0.18); }
  .ctrl-btn__label {
    font-size: 11px; color: rgba(255,255,255,0.45); font-weight: 500;
    white-space: nowrap; line-height: 1;
  }
  .ctrl-btn--active .ctrl-btn__icon {
    background: rgba(109,40,217,0.35);
    border-color: rgba(109,40,217,0.5); color: #A865F7;
  }
  .ctrl-btn--muted .ctrl-btn__icon {
    background: rgba(239,68,68,0.25);
    border-color: rgba(239,68,68,0.4); color: #F87171;
  }
  .ctrl-btn--end .ctrl-btn__icon {
    width: 62px; height: 62px;
    background: #DC2626; border-color: #DC2626; color: #fff;
  }
  .ctrl-btn--end:hover .ctrl-btn__icon { background: #B91C1C; }
  .ctrl-btn--end .ctrl-btn__icon .material-symbols-outlined { font-size: 26px; }

  /* ── Chat sidebar (pushes layout) ───────── */
  .chat-sidebar {
    width: 0; overflow: hidden;
    background: rgba(18, 15, 30, 0.98);
    border-left: 1px solid rgba(255,255,255,0.06);
    display: flex; flex-direction: column;
    transition: width .25s ease;
    flex-shrink: 0;
  }
  .chat-sidebar.is-open { width: 320px; }
  .chat-sidebar__head {
    padding: 16px 16px 13px;
    border-bottom: 1px solid rgba(255,255,255,0.07);
    display: flex; align-items: center; justify-content: space-between;
    font-size: 14px; font-weight: 700; color: rgba(255,255,255,0.85);
    white-space: nowrap; min-width: 0;
  }
  .chat-sidebar__close {
    background: none; border: none;
    color: rgba(255,255,255,0.35); cursor: pointer;
    display: flex; align-items: center; justify-content: center;
  }
  .chat-sidebar__close .material-symbols-outlined { font-size: 20px; }
  .chat-sidebar__body { flex: 1; overflow-y: auto; padding: 14px 14px; display: flex; flex-direction: column; gap: 12px; min-width: 320px; }
  .chat-msg { display: flex; gap: 8px; }
  .chat-msg__av {
    width: 26px; height: 26px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 10px; font-weight: 700; color: #fff; flex-shrink: 0; margin-top: 2px;
  }
  .chat-msg__name { font-size: 12px; font-weight: 700; color: rgba(255,255,255,0.8); }
  .chat-msg__time { font-size: 10.5px; color: rgba(255,255,255,0.3); margin-left: 6px; }
  .chat-msg__text { font-size: 13px; color: rgba(255,255,255,0.6); line-height: 1.45; margin-top: 2px; }
  .chat-sidebar__input {
    padding: 12px 12px;
    border-top: 1px solid rgba(255,255,255,0.07);
    display: flex; gap: 8px; align-items: center; min-width: 320px;
  }
  .chat-sidebar__input input {
    flex: 1; background: rgba(255,255,255,0.07);
    border: 1px solid rgba(255,255,255,0.10);
    border-radius: 20px; padding: 8px 14px;
    font-size: 13px; color: #fff; outline: none; font-family: inherit;
  }
  .chat-sidebar__input input::placeholder { color: rgba(255,255,255,0.3); }
  .chat-sidebar__send {
    width: 34px; height: 34px; border-radius: 50%;
    background: var(--color-primary); border: none;
    cursor: pointer; display: flex; align-items: center; justify-content: center; color: #fff;
    flex-shrink: 0;
  }
</style>
</head>
<body>

  <!-- Main call area -->
  <div class="call-main">
    <header class="call-header">
      <a class="call-header__logo" href="dm.html">
        <div class="call-header__mark">
          <img src="assets/nic-labs-icon.png" alt="NIC-Labs" />
        </div>
        <span class="call-header__name">NIC Chat</span>
      </a>
      <a class="call-header__back" href="dm.html">
        <span class="material-symbols-outlined" style="font-size:16px;">arrow_back</span>
        Voltar ao chat
      </a>
    </header>

    <div class="call-stage">

      <!-- Remote avatar -->
      <div class="avatar-ring">
        <div class="avatar-ring__outer"></div>
        <div class="avatar-ring__outer"></div>
        <div class="avatar-ring__outer"></div>
        <div class="avatar-ring__face">JL</div>
      </div>

      <h1 class="call-name">Juliane Lino</h1>
      <p class="call-role">Infraestrutura &amp; Suporte</p>

      <div class="call-status">
        <span class="call-status__dot"></span>
        Falando
        <div class="vol-bars">
          <span></span><span></span><span></span><span></span><span></span>
        </div>
        <span class="call-timer" id="timer">04:27</span>
      </div>

      <!-- Self bubble -->
      <div class="self-bubble">
        AN
        <div class="self-bubble__label">Você</div>
      </div>

    </div>

    <!-- Controls -->
    <div class="call-controls">
      <button class="ctrl-btn ctrl-btn--active" id="btnSpeaker">
        <div class="ctrl-btn__icon"><span class="material-symbols-outlined">volume_up</span></div>
        <div class="ctrl-btn__label">Caixa de som</div>
      </button>

      <button class="ctrl-btn" id="btnMic">
        <div class="ctrl-btn__icon"><span class="material-symbols-outlined">mic</span></div>
        <div class="ctrl-btn__label">Microfone</div>
      </button>

      <button class="ctrl-btn ctrl-btn--end" onclick="window.location='dm.html'">
        <div class="ctrl-btn__icon"><span class="material-symbols-outlined">call_end</span></div>
        <div class="ctrl-btn__label" style="color:rgba(255,255,255,0.4);">Encerrar</div>
      </button>

      <button class="ctrl-btn" id="btnChat">
        <div class="ctrl-btn__icon"><span class="material-symbols-outlined">chat</span></div>
        <div class="ctrl-btn__label">Chat</div>
      </button>

      <button class="ctrl-btn">
        <div class="ctrl-btn__icon"><span class="material-symbols-outlined">more_horiz</span></div>
        <div class="ctrl-btn__label">Mais</div>
      </button>
    </div>
  </div>

  <!-- Chat sidebar -->
  <aside class="chat-sidebar" id="chatSidebar">
    <div class="chat-sidebar__head">
      Chat da chamada
      <button class="chat-sidebar__close" id="closeChat">
        <span class="material-symbols-outlined">close</span>
      </button>
    </div>
    <div class="chat-sidebar__body">
      <div class="chat-msg">
        <div class="chat-msg__av" style="background:linear-gradient(135deg,#DB2777,#F472B6)">JL</div>
        <div>
          <div><span class="chat-msg__name">Juliane Lino</span><span class="chat-msg__time">10:07</span></div>
          <div class="chat-msg__text">Pode trazer os logs do Traefik também?</div>
        </div>
      </div>
      <div class="chat-msg" style="flex-direction:row-reverse;">
        <div class="chat-msg__av" style="background:linear-gradient(135deg,#7B43E8,#B485F4)">AN</div>
        <div style="align-items:flex-end;display:flex;flex-direction:column;">
          <div style="text-align:right;"><span class="chat-msg__time" style="margin-right:6px;margin-left:0">10:08</span><span class="chat-msg__name">Você</span></div>
          <div class="chat-msg__text" style="text-align:right;">Sim, vou compartilhar agora.</div>
        </div>
      </div>
    </div>
    <div class="chat-sidebar__input">
      <input placeholder="Mensagem…" type="text" />
      <button class="chat-sidebar__send"><span class="material-symbols-outlined" style="font-size:18px;">send</span></button>
    </div>
  </aside>

<script>
  // Timer
  let secs = 4 * 60 + 27;
  setInterval(() => {
    secs++;
    const m = String(Math.floor(secs/60)).padStart(2,'0');
    const s = String(secs%60).padStart(2,'0');
    document.getElementById('timer').textContent = m+':'+s;
  }, 1000);

  // Mic toggle
  document.getElementById('btnMic').addEventListener('click', function() {
    const muted = this.classList.toggle('ctrl-btn--muted');
    const ico = this.querySelector('.material-symbols-outlined');
    ico.textContent = muted ? 'mic_off' : 'mic';
    this.querySelector('.ctrl-btn__label').textContent = muted ? 'Mutar' : 'Microfone';
    const bubble = document.querySelector('.self-bubble');
    let badge = bubble.querySelector('.self-muted');
    if (muted && !badge) {
      badge = document.createElement('div');
      badge.className = 'self-muted';
      badge.innerHTML = '<span class="material-symbols-outlined">mic_off</span>';
      bubble.appendChild(badge);
    } else if (!muted && badge) {
      badge.remove();
    }
  });

  // Speaker toggle
  document.getElementById('btnSpeaker').addEventListener('click', function() {
    const on = this.classList.toggle('ctrl-btn--active');
    this.querySelector('.material-symbols-outlined').textContent = on ? 'volume_up' : 'volume_off';
  });

  // Chat sidebar
  const chatSidebar = document.getElementById('chatSidebar');
  const btnChat = document.getElementById('btnChat');
  const closeChat = document.getElementById('closeChat');
  btnChat.addEventListener('click', () => {
    const open = chatSidebar.classList.toggle('is-open');
    btnChat.classList.toggle('ctrl-btn--active', open);
  });
  closeChat.addEventListener('click', () => {
    chatSidebar.classList.remove('is-open');
    btnChat.classList.remove('ctrl-btn--active');
  });
</script>
</body>
</html>
