name: ${COMPOSE_PROJECT_NAME:-nchat-dev}

services:
  postgres:
    image: ${POSTGRES_IMAGE}
    env_file:
      - .env.dev
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_HOST_PORT}:5432"
    volumes:
      - nchat_postgres_data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    networks:
      - nchat-dev

  valkey:
    image: ${VALKEY_IMAGE}
    env_file:
      - .env.dev
    environment:
      VALKEY_PASSWORD: ${VALKEY_PASSWORD}
    command:
      - valkey-server
      - /usr/local/etc/valkey/valkey.conf
      - --requirepass
      - ${VALKEY_PASSWORD}
    ports:
      - "${VALKEY_HOST_PORT}:6379"
    volumes:
      - nchat_valkey_data:/data
      - ./valkey/valkey.conf:/usr/local/etc/valkey/valkey.conf:ro
    healthcheck:
      test: ["CMD-SHELL", 'REDISCLI_AUTH="$$VALKEY_PASSWORD" valkey-cli ping | grep -q PONG']
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    networks:
      - nchat-dev

  clamav:
    # Antimalware scanning for attachments (RF-22).
    #
    # file-service streams each finished upload here over clamd's INSTREAM and
    # persists the verdict; a daemon that is down or unreachable never produces
    # an approval, so stopping this container leaves uploads in "em analise"
    # rather than making them downloadable.
    # Defaulted, like SEAWEEDFS_VOLUME_2_HOST_PORT below: an operator whose
    # .env.dev predates RF-22 must still be able to bring the project up. Without
    # a default, an unset variable makes compose reject the *whole* file, not
    # just this service.
    image: ${CLAMAV_IMAGE:-clamav/clamav:1.4}
    container_name: nchat-clamav
    restart: unless-stopped
    env_file:
      - .env.dev
    environment:
      # The image's own entrypoint would otherwise start freshclam as well; the
      # signature database that ships with the image is enough for local work and
      # avoids a network fetch on every start. Set to false when testing against
      # current signatures.
      CLAMAV_NO_FRESHCLAMD: "${CLAMAV_NO_FRESHCLAMD:-true}"
      CLAMAV_NO_MILTERD: "true"
    ports:
      # Bound to the loopback interface only. The services run on the host in
      # local development (see the upload-guard note below), so the port has to
      # be reachable from there — but a malware daemon must never be reachable
      # from the network, and it has no authentication of its own to fall back on.
      - "127.0.0.1:${CLAMAV_HOST_PORT:-3310}:3310"
    volumes:
      # The limits in this file are derived from uploadpolicy's 512 MiB ceiling.
      # A StreamMaxLength below it would make the largest attachments permanently
      # unscannable, and therefore permanently undownloadable.
      - ./clamav/clamd.conf:/etc/clamav/clamd.conf:ro
      - nchat_clamav_data:/var/lib/clamav
    healthcheck:
      # PING/PONG on the same socket file-service uses, so the check proves the
      # daemon is actually accepting commands rather than merely running.
      test: ["CMD-SHELL", "clamdcheck.sh || exit 1"]
      interval: 15s
      timeout: 10s
      # Generous: loading the signature database takes a while on first start,
      # and a restart loop here would be worse than a slow first scan.
      retries: 20
      start_period: 120s
    networks:
      - nchat-dev

  seaweed-master:
    image: ${SEAWEEDFS_IMAGE}
    env_file:
      - .env.dev
    command: "master -ip=seaweed-master -ip.bind=0.0.0.0 -mdir=/data"
    ports:
      - "${SEAWEEDFS_MASTER_HOST_PORT}:9333"
    volumes:
      - nchat_seaweed_master_data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:9333/cluster/status || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    networks:
      - nchat-dev

  seaweed-volume:
    image: ${SEAWEEDFS_IMAGE}
    env_file:
      - .env.dev
    command: "volume -mserver=seaweed-master:9333 -ip=seaweed-volume -ip.bind=0.0.0.0 -dir=/data -port=8088"
    ports:
      - "${SEAWEEDFS_VOLUME_HOST_PORT}:8088"
    volumes:
      - nchat_seaweed_volume_data:/data
    depends_on:
      seaweed-master:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:8088/status || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    networks:
      - nchat-dev

  seaweed-filer:
    image: ${SEAWEEDFS_IMAGE}
    env_file:
      - .env.dev
    command: "filer -master=seaweed-master:9333 -ip=seaweed-filer -ip.bind=0.0.0.0 -defaultReplicaPlacement=${SEAWEEDFS_REPLICATION}"
    ports:
      - "${SEAWEEDFS_FILER_HOST_PORT}:8888"
    volumes:
      - nchat_seaweed_filer_data:/data
    depends_on:
      seaweed-master:
        condition: service_healthy
      seaweed-volume:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:8888/ || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    networks:
      - nchat-dev

  seaweed-s3:
    image: ${SEAWEEDFS_IMAGE}
    env_file:
      - .env.dev
    command: "s3 -filer=seaweed-filer:8888 -ip.bind=0.0.0.0"
    ports:
      - "${SEAWEEDFS_S3_HOST_PORT}:8333"
    depends_on:
      seaweed-filer:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:8333/ || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    networks:
      - nchat-dev

  seaweed-volume-2:
    image: ${SEAWEEDFS_IMAGE}
    env_file:
      - .env.dev
    profiles:
      - seaweed-replication
    command: "volume -mserver=seaweed-master:9333 -ip=seaweed-volume-2 -ip.bind=0.0.0.0 -dir=/data -port=8088"
    ports:
      - "${SEAWEEDFS_VOLUME_2_HOST_PORT:-8089}:8088"
    volumes:
      - nchat_seaweed_volume_2_data:/data
    depends_on:
      seaweed-master:
        condition: service_started
    networks:
      - nchat-dev

  upload-guard:
    # RF-32: streams attachment uploads to file-service under a static body cap.
    # Traefik's only native cap buffers the whole body before forwarding, which
    # would let an unauthenticated client fill the gateway's disk; nginx caps
    # while streaming. See infra/k8s/base/services/upload-guard/README.md.
    image: ${UPLOAD_GUARD_IMAGE}
    container_name: nchat-upload-guard
    restart: unless-stopped
    profiles:
      - gateway
    command:
      - /bin/sh
      - -c
      - >-
        envsubst '$$UPLOAD_GUARD_UPSTREAM $$UPLOAD_GUARD_PORT'
        < /etc/nginx/templates/nginx.conf.template > /tmp/nginx.conf
        && exec nginx -c /tmp/nginx.conf -g 'daemon off;'
    environment:
      # The services run on the host in local development, exactly as the
      # Traefik routes above assume.
      UPLOAD_GUARD_UPSTREAM: host.docker.internal:8083
      UPLOAD_GUARD_PORT: "8080"
    volumes:
      # The same template the Kubernetes ConfigMap is generated from, so local
      # and cluster cannot drift.
      - ../k8s/base/services/upload-guard/nginx.conf.template:/etc/nginx/templates/nginx.conf.template:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - nchat-dev

  traefik:
    image: ${TRAEFIK_IMAGE}
    container_name: nchat-traefik
    restart: unless-stopped
    profiles:
      - gateway
    command:
      - --configFile=/etc/traefik/traefik.yml
    ports:
      - "127.0.0.1:${TRAEFIK_HTTP_HOST_PORT}:8080"
      - "127.0.0.1:${TRAEFIK_HTTPS_HOST_PORT}:8443"
      - "127.0.0.1:${TRAEFIK_DASHBOARD_HOST_PORT}:8081"
    volumes:
      - ../traefik/local/traefik.yml:/etc/traefik/traefik.yml:ro
      - ../traefik/local/dynamic.yml:/etc/traefik/dynamic.yml:ro
      - ../traefik/local/certs:/certs:ro
    depends_on:
      - upload-guard
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - nchat-dev

  prometheus:
    image: ${PROMETHEUS_IMAGE}
    container_name: nchat-prometheus
    profiles:
      - observability
    ports:
      - "127.0.0.1:${PROMETHEUS_HOST_PORT:-9090}:9090"
    volumes:
      - ../observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - nchat_prometheus_data:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.enable-lifecycle
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - nchat-dev

  grafana:
    image: ${GRAFANA_IMAGE}
    container_name: nchat-grafana
    profiles:
      - observability
    ports:
      - "127.0.0.1:${GRAFANA_HOST_PORT:-3000}:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    volumes:
      - ../observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ../observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - nchat_grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
      - jaeger
    networks:
      - nchat-dev

  jaeger:
    image: ${JAEGER_IMAGE}
    container_name: nchat-jaeger
    profiles:
      - observability
    ports:
      - "127.0.0.1:${JAEGER_UI_HOST_PORT:-16686}:16686"
      - "127.0.0.1:${JAEGER_OTLP_GRPC_HOST_PORT:-4317}:4317"
      - "127.0.0.1:${JAEGER_OTLP_HTTP_HOST_PORT:-4318}:4318"
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    networks:
      - nchat-dev

  # LiveKit + coturn — dev prep for media-service (V1.0 Sprints 9-10).
  # Config files are rendered from *.template sources by scripts/dev/_media_env.sh
  # into gitignored *.runtime.* files before these services start.
  livekit:
    image: ${LIVEKIT_IMAGE}
    container_name: nchat-livekit
    profiles:
      - media
    env_file:
      - .env.dev
    environment:
      LIVEKIT_KEYS: "${LIVEKIT_API_KEY}: ${LIVEKIT_API_SECRET}"
    command:
      - --config
      - /etc/livekit/livekit.yaml
    ports:
      - "127.0.0.1:${LIVEKIT_HOST_PORT}:7880"
      - "127.0.0.1:${LIVEKIT_RTC_TCP_HOST_PORT}:7881"
      - "127.0.0.1:${LIVEKIT_RTC_UDP_PORT_START}-${LIVEKIT_RTC_UDP_PORT_END}:${LIVEKIT_RTC_UDP_PORT_START}-${LIVEKIT_RTC_UDP_PORT_END}/udp"
    volumes:
      - ./livekit/livekit.runtime.yaml:/etc/livekit/livekit.yaml:ro
    depends_on:
      - coturn
    networks:
      - nchat-dev

  coturn:
    image: ${COTURN_IMAGE}
    container_name: nchat-coturn
    profiles:
      - media
    env_file:
      - .env.dev
    command:
      - -c
      - /etc/coturn/turnserver.conf
    ports:
      - "127.0.0.1:${COTURN_LISTENING_PORT}:3478"
      - "127.0.0.1:${COTURN_LISTENING_PORT}:3478/udp"
      - "127.0.0.1:${COTURN_RELAY_MIN_PORT}-${COTURN_RELAY_MAX_PORT}:${COTURN_RELAY_MIN_PORT}-${COTURN_RELAY_MAX_PORT}/udp"
    volumes:
      - ./coturn/turnserver.runtime.conf:/etc/coturn/turnserver.conf:ro
    networks:
      - nchat-dev

networks:
  nchat-dev:
    name: nchat-dev

volumes:
  nchat_postgres_data:
  nchat_valkey_data:
  nchat_clamav_data:
  nchat_seaweed_master_data:
  nchat_seaweed_volume_data:
  nchat_seaweed_filer_data:
  nchat_seaweed_volume_2_data:
  nchat_prometheus_data:
  nchat_grafana_data:
