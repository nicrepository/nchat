name: ${COMPOSE_PROJECT_NAME:-nchat-dev}

services:
  postgres:
    image: ${POSTGRES_IMAGE}
    env_file:
      - .env.dev
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_HOST_PORT}:5432"
    volumes:
      - nchat_postgres_data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    networks:
      - nchat-dev

  valkey:
    image: ${VALKEY_IMAGE}
    env_file:
      - .env.dev
    environment:
      VALKEY_PASSWORD: ${VALKEY_PASSWORD}
    command:
      - valkey-server
      - /usr/local/etc/valkey/valkey.conf
      - --requirepass
      - ${VALKEY_PASSWORD}
    ports:
      - "${VALKEY_HOST_PORT}:6379"
    volumes:
      - nchat_valkey_data:/data
      - ./valkey/valkey.conf:/usr/local/etc/valkey/valkey.conf:ro
    healthcheck:
      test: ["CMD-SHELL", 'REDISCLI_AUTH="$$VALKEY_PASSWORD" valkey-cli ping | grep -q PONG']
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    networks:
      - nchat-dev

  seaweed-master:
    image: ${SEAWEEDFS_IMAGE}
    env_file:
      - .env.dev
    command: "master -ip=seaweed-master -ip.bind=0.0.0.0 -mdir=/data"
    ports:
      - "${SEAWEEDFS_MASTER_HOST_PORT}:9333"
    volumes:
      - nchat_seaweed_master_data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:9333/cluster/status || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    networks:
      - nchat-dev

  seaweed-volume:
    image: ${SEAWEEDFS_IMAGE}
    env_file:
      - .env.dev
    command: "volume -mserver=seaweed-master:9333 -ip=seaweed-volume -ip.bind=0.0.0.0 -dir=/data -port=8088"
    ports:
      - "${SEAWEEDFS_VOLUME_HOST_PORT}:8088"
    volumes:
      - nchat_seaweed_volume_data:/data
    depends_on:
      seaweed-master:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:8088/status || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    networks:
      - nchat-dev

  seaweed-filer:
    image: ${SEAWEEDFS_IMAGE}
    env_file:
      - .env.dev
    command: "filer -master=seaweed-master:9333 -ip=seaweed-filer -ip.bind=0.0.0.0 -defaultReplicaPlacement=${SEAWEEDFS_REPLICATION}"
    ports:
      - "${SEAWEEDFS_FILER_HOST_PORT}:8888"
    volumes:
      - nchat_seaweed_filer_data:/data
    depends_on:
      seaweed-master:
        condition: service_healthy
      seaweed-volume:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:8888/ || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    networks:
      - nchat-dev

  seaweed-s3:
    image: ${SEAWEEDFS_IMAGE}
    env_file:
      - .env.dev
    command: "s3 -filer=seaweed-filer:8888 -ip.bind=0.0.0.0"
    ports:
      - "${SEAWEEDFS_S3_HOST_PORT}:8333"
    depends_on:
      seaweed-filer:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:8333/ || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    networks:
      - nchat-dev

  seaweed-volume-2:
    image: ${SEAWEEDFS_IMAGE}
    env_file:
      - .env.dev
    profiles:
      - seaweed-replication
    command: "volume -mserver=seaweed-master:9333 -ip=seaweed-volume-2 -ip.bind=0.0.0.0 -dir=/data -port=8088"
    ports:
      - "${SEAWEEDFS_VOLUME_2_HOST_PORT:-8089}:8088"
    volumes:
      - nchat_seaweed_volume_2_data:/data
    depends_on:
      seaweed-master:
        condition: service_started
    networks:
      - nchat-dev

  traefik:
    image: ${TRAEFIK_IMAGE}
    container_name: nchat-traefik
    restart: unless-stopped
    profiles:
      - gateway
    command:
      - --configFile=/etc/traefik/traefik.yml
    ports:
      - "127.0.0.1:${TRAEFIK_HTTP_HOST_PORT}:8080"
      - "127.0.0.1:${TRAEFIK_HTTPS_HOST_PORT}:8443"
      - "127.0.0.1:${TRAEFIK_DASHBOARD_HOST_PORT}:8081"
    volumes:
      - ../traefik/local/traefik.yml:/etc/traefik/traefik.yml:ro
      - ../traefik/local/dynamic.yml:/etc/traefik/dynamic.yml:ro
      - ../traefik/local/certs:/certs:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - nchat-dev

  prometheus:
    image: ${PROMETHEUS_IMAGE}
    container_name: nchat-prometheus
    profiles:
      - observability
    ports:
      - "127.0.0.1:${PROMETHEUS_HOST_PORT:-9090}:9090"
    volumes:
      - ../observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - nchat_prometheus_data:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.enable-lifecycle
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - nchat-dev

  grafana:
    image: ${GRAFANA_IMAGE}
    container_name: nchat-grafana
    profiles:
      - observability
    ports:
      - "127.0.0.1:${GRAFANA_HOST_PORT:-3000}:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    volumes:
      - ../observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - nchat_grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
      - jaeger
    networks:
      - nchat-dev

  jaeger:
    image: ${JAEGER_IMAGE}
    container_name: nchat-jaeger
    profiles:
      - observability
    ports:
      - "127.0.0.1:${JAEGER_UI_HOST_PORT:-16686}:16686"
      - "127.0.0.1:${JAEGER_OTLP_GRPC_HOST_PORT:-4317}:4317"
      - "127.0.0.1:${JAEGER_OTLP_HTTP_HOST_PORT:-4318}:4318"
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    networks:
      - nchat-dev

networks:
  nchat-dev:
    name: nchat-dev

volumes:
  nchat_postgres_data:
  nchat_valkey_data:
  nchat_seaweed_master_data:
  nchat_seaweed_volume_data:
  nchat_seaweed_filer_data:
  nchat_seaweed_volume_2_data:
  nchat_prometheus_data:
  nchat_grafana_data:
