server {
  listen 8080;
  server_name _;
  server_tokens off;
  root /usr/share/nginx/html;

  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header X-Frame-Options "DENY" always;
  add_header Permissions-Policy "camera=(self), microphone=(self), display-capture=(self)" always;
  # Única CSP emitida pelo repositório. Não adicionar Report-Only aqui: duas
  # políticas contraditórias foi exatamente a origem do issue #388.
  # connect-src usa $host (o Traefik só roteia o host do Ingress) para liberar o
  # WebSocket/HTTPS same-origin sem depender de 'self' cobrir wss: no navegador.
  # ${NCHAT_WEB_LIVEKIT_CONNECT_SRC} é o único slot expandido por envsubst (ver
  # Dockerfile.web / infra/k8s/base/web/deployment.yaml) e carrega o allowlist
  # de LiveKit por ambiente (issue #528); vazio por padrão, sem domínio fixo aqui.
  add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; media-src 'self' blob:; worker-src 'self' blob:; connect-src 'self' wss://$host https://$host ${NCHAT_WEB_LIVEKIT_CONNECT_SRC};" always;

  location = /healthz { access_log off; return 200 "ok\n"; }
  location = /readyz { access_log off; return 200 "ready\n"; }
  location / { try_files $uri $uri/ /index.html; }
}
