server {
  listen 8080;
  server_name _;
  server_tokens off;
  root /usr/share/nginx/html;

  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "no-referrer" always;
  add_header X-Frame-Options "DENY" always;
  add_header Permissions-Policy "camera=(), microphone=(), display-capture=(), geolocation=()" always;
  # Strict-Transport-Security is emitted here and not only at the gateway: the
  # console is reachable over HTTPS in every environment, and the header must
  # survive a gateway that is reconfigured.
  add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

  # CSP do console administrativo. Deliberadamente mais restrita que a do chat:
  # este bundle nao carrega midia, nao abre WebSocket e nao embute nada de
  # terceiros, entao nada disso precisa estar liberado.
  #
  #   frame-ancestors 'none'  -> o console nao pode ser embutido; e a defesa
  #                              contra clickjacking, junto com X-Frame-Options
  #                              para navegadores antigos.
  #   connect-src 'self'      -> so o proprio host. A Admin API e same-origin.
  #   img-src 'self' data:    -> sem blob:, que o console nao usa.
  #   sem 'unsafe-eval', sem 'unsafe-inline' em script-src.
  add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; media-src 'none'; worker-src 'none'; connect-src 'self';" always;

  # O bundle e o index nunca sao cacheados por proxies compartilhados: o console
  # e conteudo autenticado por natureza.
  add_header Cache-Control "no-store" always;

  # Nenhum add_header nestes blocos, e isso e proposital: no nginx, um add_header
  # em nivel de location cancela a heranca de *todos* os headers do server, e
  # /healthz e /readyz sairiam sem CSP, sem HSTS e sem nosniff. O
  # Cache-Control: no-store acima ja se aplica aqui por heranca.
  location = /healthz { access_log off; return 200 "ok\n"; }
  location = /readyz { access_log off; return 200 "ready\n"; }
  location / { try_files $uri $uri/ /index.html; }
}
