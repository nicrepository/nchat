tls:
  certificates:
    - certFile: /certs/nchat.local.pem
      keyFile: /certs/nchat.local-key.pem
  options:
    default:
      minVersion: VersionTLS13
      sniStrict: true

http:
  routers:
    traefik-dashboard:
      entryPoints:
        - dashboard
      rule: PathPrefix(`/api`) || PathPrefix(`/dashboard`)
      service: api@internal

    nchat-auth-health:
      entryPoints:
        - web
      rule: Host(`nchat.local`) && (Path(`/api/auth/healthz`) || Path(`/api/auth/readyz`) || Path(`/api/auth/version`))
      priority: 200
      service: auth-service
      middlewares:
        - security-headers
        - compress
        - rewrite-auth-probe-prefix

    nchat-auth-health-https:
      entryPoints:
        - websecure
      rule: Host(`nchat.local`) && (Path(`/api/auth/healthz`) || Path(`/api/auth/readyz`) || Path(`/api/auth/version`))
      priority: 200
      service: auth-service
      middlewares:
        - security-headers
        - compress
        - rewrite-auth-probe-prefix
      tls: {}

    nchat-auth:
      entryPoints:
        - web
      rule: Host(`nchat.local`) && PathPrefix(`/api/auth`)
      priority: 100
      service: auth-service
      middlewares:
        - security-headers
        - compress
        - rewrite-auth-api-prefix

    nchat-auth-https:
      entryPoints:
        - websecure
      rule: Host(`nchat.local`) && PathPrefix(`/api/auth`)
      priority: 100
      service: auth-service
      middlewares:
        - security-headers
        - compress
        - rewrite-auth-api-prefix
      tls: {}

    nchat-chat-health:
      entryPoints:
        - web
      rule: Host(`nchat.local`) && (Path(`/api/chat/healthz`) || Path(`/api/chat/readyz`) || Path(`/api/chat/version`))
      priority: 200
      service: chat-service
      middlewares:
        - security-headers
        - compress
        - strip-chat-prefix

    nchat-chat-health-https:
      entryPoints:
        - websecure
      rule: Host(`nchat.local`) && (Path(`/api/chat/healthz`) || Path(`/api/chat/readyz`) || Path(`/api/chat/version`))
      priority: 200
      service: chat-service
      middlewares:
        - security-headers
        - compress
        - strip-chat-prefix
      tls: {}

    nchat-chat:
      entryPoints:
        - web
      rule: Host(`nchat.local`) && PathPrefix(`/api/chat`)
      priority: 100
      service: chat-service
      middlewares:
        - security-headers
        - compress

    nchat-chat-https:
      entryPoints:
        - websecure
      rule: Host(`nchat.local`) && PathPrefix(`/api/chat`)
      priority: 100
      service: chat-service
      middlewares:
        - security-headers
        - compress
      tls: {}

    # RF-32: only the two attachment upload routes go through the upload guard,
    # which caps the request body while streaming it. Higher priority than
    # nchat-files below, and narrowed by method and path so nothing else — not
    # health, not download, not listing — pays the extra hop or could be used to
    # reach file-service around the cap.
    nchat-files-upload:
      entryPoints:
        - web
      rule: Host(`nchat.local`) && Method(`POST`) && PathRegexp(`^/api/files/(channels|dm)/[^/]+/attachments$`)
      priority: 200
      service: upload-guard
      middlewares:
        - security-headers
        - upload-inflight
        - strip-files-prefix

    nchat-files-upload-https:
      entryPoints:
        - websecure
      rule: Host(`nchat.local`) && Method(`POST`) && PathRegexp(`^/api/files/(channels|dm)/[^/]+/attachments$`)
      priority: 200
      service: upload-guard
      middlewares:
        - security-headers
        - upload-inflight
        - strip-files-prefix
      tls: {}

    nchat-files:
      entryPoints:
        - web
      rule: Host(`nchat.local`) && PathPrefix(`/api/files`)
      priority: 100
      service: file-service
      middlewares:
        - security-headers
        - compress
        - strip-files-prefix

    nchat-files-https:
      entryPoints:
        - websecure
      rule: Host(`nchat.local`) && PathPrefix(`/api/files`)
      priority: 100
      service: file-service
      middlewares:
        - security-headers
        - compress
        - strip-files-prefix
      tls: {}

    nchat-notifications:
      entryPoints:
        - web
      rule: Host(`nchat.local`) && PathPrefix(`/api/notifications`)
      priority: 100
      service: notification-service
      middlewares:
        - security-headers
        - compress
        - strip-notifications-prefix

    nchat-notifications-https:
      entryPoints:
        - websecure
      rule: Host(`nchat.local`) && PathPrefix(`/api/notifications`)
      priority: 100
      service: notification-service
      middlewares:
        - security-headers
        - compress
        - strip-notifications-prefix
      tls: {}

    nchat-admin:
      entryPoints:
        - web
      rule: Host(`nchat.local`) && PathPrefix(`/api/admin`)
      priority: 100
      service: admin-service
      middlewares:
        - security-headers
        - compress
        - strip-admin-prefix

    nchat-admin-https:
      entryPoints:
        - websecure
      rule: Host(`nchat.local`) && PathPrefix(`/api/admin`)
      priority: 100
      service: admin-service
      middlewares:
        - security-headers
        - compress
        - strip-admin-prefix
      tls: {}

    nchat-search:
      entryPoints:
        - web
      rule: Host(`nchat.local`) && PathPrefix(`/api/search`)
      priority: 100
      service: search-service
      middlewares:
        - security-headers
        - compress
        - strip-search-prefix

    nchat-search-https:
      entryPoints:
        - websecure
      rule: Host(`nchat.local`) && PathPrefix(`/api/search`)
      priority: 100
      service: search-service
      middlewares:
        - security-headers
        - compress
        - strip-search-prefix
      tls: {}

    nchat-media:
      entryPoints:
        - web
      rule: Host(`nchat.local`) && PathPrefix(`/api/media`)
      priority: 100
      service: media-service
      middlewares:
        - security-headers
        - compress
        - strip-media-prefix

    nchat-media-https:
      entryPoints:
        - websecure
      rule: Host(`nchat.local`) && PathPrefix(`/api/media`)
      priority: 100
      service: media-service
      middlewares:
        - security-headers
        - compress
        - strip-media-prefix
      tls: {}

    nchat-web:
      entryPoints:
        - web
      rule: Host(`nchat.local`) && PathPrefix(`/`)
      priority: 1
      service: web
      middlewares:
        - security-headers
        - compress

    nchat-web-https:
      entryPoints:
        - websecure
      rule: Host(`nchat.local`) && PathPrefix(`/`)
      priority: 1
      service: web
      middlewares:
        - security-headers
        - compress
      tls: {}

  services:
    web:
      loadBalancer:
        servers:
          - url: http://host.docker.internal:5173

    auth-service:
      loadBalancer:
        servers:
          - url: http://host.docker.internal:8081

    chat-service:
      loadBalancer:
        servers:
          - url: http://host.docker.internal:8082

    file-service:
      loadBalancer:
        servers:
          - url: http://host.docker.internal:8083

    upload-guard:
      loadBalancer:
        servers:
          - url: http://nchat-upload-guard:8080

    notification-service:
      loadBalancer:
        servers:
          - url: http://host.docker.internal:8084

    admin-service:
      loadBalancer:
        servers:
          - url: http://host.docker.internal:8085

    search-service:
      loadBalancer:
        servers:
          - url: http://host.docker.internal:8086

    media-service:
      loadBalancer:
        servers:
          - url: http://host.docker.internal:8087

  middlewares:
    security-headers:
      headers:
        browserXssFilter: true
        contentTypeNosniff: true
        frameDeny: true
        referrerPolicy: no-referrer
        customResponseHeaders:
          X-Gateway: traefik-local

    compress:
      compress: {}

    # RF-32: a conservative ceiling on concurrent upload requests reaching the
    # gateway, as infrastructure defence in depth.
    #
    # It is a total per router, not per source: the sources here sit behind
    # corporate NAT and other proxies, so an IP-keyed limit would either punish
    # a whole office sharing one address or be trivially spread across a v6
    # prefix. A flat ceiling is honest about what it protects — the gateway —
    # and leaves per-user fairness to the place that knows who the user is.
    #
    # It is deliberately above the cluster-wide slot count enforced by
    # file-service (FILE_UPLOAD_MAX_CONCURRENT), so this never becomes the
    # binding limit: file-service answers 429/503 with a code and a Retry-After,
    # which is a far better answer than a proxy rejection. This middleware
    # substitutes for none of authentication, authorization, the per-user limit,
    # distributed admission control or the real stream cap.
    upload-inflight:
      inFlightReq:
        amount: 16

    rewrite-auth-api-prefix:
      replacePathRegex:
        regex: "^/api/auth/(.*)"
        replacement: "/auth/${1}"

    rewrite-auth-probe-prefix:
      replacePathRegex:
        regex: "^/api/auth/(healthz|readyz|version)$"
        replacement: "/${1}"

    strip-chat-prefix:
      stripPrefix:
        prefixes:
          - /api/chat

    strip-files-prefix:
      stripPrefix:
        prefixes:
          - /api/files

    strip-notifications-prefix:
      stripPrefix:
        prefixes:
          - /api/notifications

    strip-admin-prefix:
      stripPrefix:
        prefixes:
          - /api/admin

    strip-search-prefix:
      stripPrefix:
        prefixes:
          - /api/search

    strip-media-prefix:
      stripPrefix:
        prefixes:
          - /api/media
