global:
  scrape_interval: 15s
  evaluation_interval: 15s
  scrape_timeout: 5s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: nchat-go-services
    metrics_path: /metrics
    static_configs:
      - targets:
          - host.docker.internal:8081
          - host.docker.internal:8082
          - host.docker.internal:8083
          - host.docker.internal:8084
          - host.docker.internal:8085
          - host.docker.internal:8086
          - host.docker.internal:8087
        labels:
          component: go-service
    relabel_configs:
      - source_labels: [__address__]
        regex: "host.docker.internal:(808[1-7])"
        replacement: "${1}"
        target_label: port
      - source_labels: [__address__]
        regex: "host.docker.internal:8081"
        replacement: auth-service
        target_label: service
      - source_labels: [__address__]
        regex: "host.docker.internal:8082"
        replacement: chat-service
        target_label: service
      - source_labels: [__address__]
        regex: "host.docker.internal:8083"
        replacement: file-service
        target_label: service
      - source_labels: [__address__]
        regex: "host.docker.internal:8084"
        replacement: notification-service
        target_label: service
      - source_labels: [__address__]
        regex: "host.docker.internal:8085"
        replacement: admin-service
        target_label: service
      - source_labels: [__address__]
        regex: "host.docker.internal:8086"
        replacement: search-service
        target_label: service
      - source_labels: [__address__]
        regex: "host.docker.internal:8087"
        replacement: media-service
        target_label: service

  # Traefik metrics — enable when Traefik metrics endpoint is exposed.
  # Leaving this commented until Traefik metrics endpoint is confirmed.
  # - job_name: traefik-local
  #   static_configs:
  #     - targets: ["host.docker.internal:8090"]
