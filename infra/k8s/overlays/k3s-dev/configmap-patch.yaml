apiVersion: v1
kind: ConfigMap
metadata:
  name: nchat-config
  namespace: nchat
  annotations:
    nchat.nicrepository.io/data-services: placeholders-only
data:
  APP_ENV: development
  LOG_LEVEL: info
  # k3s local default pod CIDR. Replace if Traefik runs from a different CIDR.
  AUTH_TRUSTED_PROXY_CIDRS: 10.42.0.0/16
  # RF-21 Safe Browsing. Explicit rather than left to the application default:
  # the default is false, so an absent key here is a deployment with link
  # checking off and no symptom other than nothing ever being blocked. CI
  # asserts all three supported overlays state it.
  #
  # The credentials are not here and never can be — they are the
  # nchat-link-safety Secret, mounted only by chat-service and file-service.
  # Both services refuse to start without them while these flags are true, which
  # is the intended failure: enabled with no scanner would accept every link
  # unchecked. See docs/runbooks/sealed-secrets-rotation.md.
  CHAT_LINK_SAFETY_ENABLED: "true"
  FILE_LINK_SAFETY_ENABLED: "true"
