---
# The avatar volume, which base declares as a claim with no storageClassName at
# all — so in production it would bind whatever the cluster's default class is:
# local-path, on the root disk, with reclaimPolicy Delete. Deleting the claim
# would delete every user's avatar, and the root disk is explicitly not where
# this deployment's data belongs.
#
# Naming a volume here, and binding the claim to it from ../shared, moves the
# avatars onto the same retained HDD as everything else. 1Gi is base's own
# request: avatars are a few KiB each and the claim is ReadWriteOnce because a
# single auth-service replica owns writes — see base/services/auth-service.
apiVersion: v1
kind: PersistentVolume
metadata:
  name: nchat-prod-auth-avatars
  labels:
    app.kubernetes.io/name: nchat
    app.kubernetes.io/part-of: nchat
    app.kubernetes.io/instance: nchat-prod
    app.kubernetes.io/component: auth
spec:
  capacity:
    storage: 1Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: local-hdd-geral
  local:
    path: /mnt/hdd-geral/k3s/nchat-prod/auth-avatars
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values:
                - srv-apps-01
