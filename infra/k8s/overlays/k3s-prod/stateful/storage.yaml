# The production storage claims' backing volumes.
#
# Local PersistentVolumes, the same shape nchat-dev has been running from
# infra/k8s/overlays/nchat-dev-server/server/persistent-volumes.yaml, with three
# differences that are the whole point of this file: their own names, their own
# paths under /mnt/hdd-geral/k3s/nchat-prod, and nothing shared with the
# development namespace.
#
# `local` rather than `hostPath`: that is the pattern the deployment already
# uses, and it is the one that carries node affinity, so a claim can never bind
# on a node where the directory does not exist. On this single-node cluster the
# affinity is srv-apps-01, matching where the disk is.
#
# persistentVolumeReclaimPolicy is Retain on all four. A PVC deleted by accident
# — or a namespace deleted entirely — leaves the volume Released with the data
# still on disk, to be reclaimed deliberately by an operator. Delete would hand
# the database to the garbage collector, and there is no undo for that.
#
# The directories themselves are NOT created here. Kubernetes does not create
# the target of a local PV, and the manifest that pretended to would only fail
# later with a confusing mount error. See the runbook for the exact mkdir/chown.
apiVersion: v1
kind: PersistentVolume
metadata:
  name: nchat-prod-postgres
  labels:
    app.kubernetes.io/name: nchat
    app.kubernetes.io/part-of: nchat
    app.kubernetes.io/instance: nchat-prod
    app.kubernetes.io/component: postgres
spec:
  capacity:
    storage: 30Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: local-hdd-geral
  local:
    path: /mnt/hdd-geral/k3s/nchat-prod/postgres
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values:
                - srv-apps-01
