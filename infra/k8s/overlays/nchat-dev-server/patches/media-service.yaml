apiVersion: apps/v1
kind: Deployment
metadata:
  name: media-service
  namespace: nchat
spec:
  template:
    spec:
      containers:
        - name: media-service
          envFrom:
            - configMapRef:
                name: nchat-config
          env:
            - name: LIVEKIT_API_URL
              value: wss://livekit-dev.nic-labs.com
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: nchat-postgres-runtime
                  key: DATABASE_URL
                  optional: true
            - name: AUTH_JWT_HMAC_SECRET
              valueFrom:
                secretKeyRef:
                  name: nchat-secrets
                  key: AUTH_JWT_HMAC_SECRET
                  optional: true
            - name: LIVEKIT_API_KEY
              valueFrom:
                secretKeyRef:
                  name: nchat-secrets
                  key: LIVEKIT_API_KEY
                  optional: true
            - name: LIVEKIT_API_SECRET
              valueFrom:
                secretKeyRef:
                  name: nchat-secrets
                  key: LIVEKIT_API_SECRET
                  optional: true
