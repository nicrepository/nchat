apiVersion: apps/v1
kind: Deployment
metadata:
  name: nchat-web
  namespace: nchat
spec:
  template:
    spec:
      containers:
        - name: web
          envFrom:
            - configMapRef:
                name: nchat-config
          env:
            - name: NCHAT_WEB_LIVEKIT_CONNECT_SRC
              value: "wss://livekit-dev.nic-labs.com https://livekit-dev.nic-labs.com"
