apiVersion: apps/v1
kind: Deployment
metadata:
  name: chat-service
  namespace: nchat
spec:
  template:
    spec:
      containers:
        - name: chat-service
          envFrom:
            - configMapRef:
                name: nchat-config
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: nchat-postgres-runtime
                  key: DATABASE_URL
            - name: AUTH_JWT_HMAC_SECRET
              valueFrom:
                secretKeyRef:
                  name: nchat-secrets
                  key: AUTH_JWT_HMAC_SECRET
            - name: VALKEY_URL
              valueFrom:
                secretKeyRef:
                  name: nchat-secrets
                  key: VALKEY_URL
