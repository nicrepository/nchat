apiVersion: apps/v1
kind: Deployment
metadata:
  name: notification-service
  namespace: nchat
spec:
  template:
    spec:
      containers:
        - name: notification-service
          envFrom:
            - configMapRef:
                name: nchat-config
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: nchat-postgres-runtime
                  key: DATABASE_URL
            # This overlay replaces envFrom with the ConfigMap alone, so every
            # secret a service needs is named here explicitly. Issue #745 gives
            # notification-service its first authenticated routes, and without
            # this the access token could not be verified and the push
            # subscription API would refuse to mount at all.
            - name: AUTH_JWT_HMAC_SECRET
              valueFrom:
                secretKeyRef:
                  name: nchat-secrets
                  key: AUTH_JWT_HMAC_SECRET
                  optional: true
            # The VAPID identity (issue #862), named key by key for the same
            # reason, from the Secret only this Deployment mounts. Optional:
            # without NOTIFICATION_WORKER_ENABLED nothing reads them.
            - name: NOTIFICATION_VAPID_PUBLIC_KEY
              valueFrom:
                secretKeyRef:
                  name: nchat-webpush
                  key: NOTIFICATION_VAPID_PUBLIC_KEY
                  optional: true
            - name: NOTIFICATION_VAPID_PRIVATE_KEY
              valueFrom:
                secretKeyRef:
                  name: nchat-webpush
                  key: NOTIFICATION_VAPID_PRIVATE_KEY
                  optional: true
            - name: NOTIFICATION_VAPID_SUBJECT
              valueFrom:
                secretKeyRef:
                  name: nchat-webpush
                  key: NOTIFICATION_VAPID_SUBJECT
                  optional: true
