apiVersion: apps/v1
kind: Deployment
metadata:
  name: notification-service
  namespace: nchat
spec:
  template:
    spec:
      containers:
        - name: notification-service
          envFrom:
            - configMapRef:
                name: nchat-config
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: nchat-postgres-runtime
                  key: DATABASE_URL
