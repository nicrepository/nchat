apiVersion: v1
kind: Service
metadata:
  name: livekit
spec:
  selector:
    app.kubernetes.io/component: livekit
  ports:
    - name: http
      port: 0
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: livekit
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/component: livekit
  template:
    metadata:
      labels:
        app.kubernetes.io/name: nchat
        app.kubernetes.io/part-of: nchat
        app.kubernetes.io/component: livekit
    spec:
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      enableServiceLinks: false
      automountServiceAccountToken: false
      nodeSelector:
        kubernetes.io/hostname: srv-apps-01
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: livekit
          image: livekit/livekit-server:v1.13.1@sha256:2c6869d2d5ff6c9c0166f47be1c92dad6928bfecfa5e4060a6ece48db8accfa3
          args:
            - --config
            - /etc/livekit/livekit.yaml
          env:
            - name: LIVEKIT_KEYS
              valueFrom:
                secretKeyRef:
                  name: nchat-secrets
                  key: LIVEKIT_KEYS
          ports:
            - name: http
              containerPort: 0
              protocol: TCP
            - name: rtc-tcp
              containerPort: 0
              protocol: TCP
            - name: rtc-udp
              containerPort: 0
              protocol: UDP
          readinessProbe:
            tcpSocket:
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: config
              mountPath: /etc/livekit
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: config
          secret:
            secretName: nchat-secrets
            items:
              - key: LIVEKIT_CONFIG
                path: livekit.yaml
        - name: tmp
          emptyDir: {}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: coturn
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/component: coturn
  template:
    metadata:
      labels:
        app.kubernetes.io/name: nchat
        app.kubernetes.io/part-of: nchat
        app.kubernetes.io/component: coturn
    spec:
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      enableServiceLinks: false
      automountServiceAccountToken: false
      nodeSelector:
        kubernetes.io/hostname: srv-apps-01
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: coturn
          image: coturn/coturn:4.12.0@sha256:161cedd63c5414c2136f306098e02e9aede74606cedad8b9b8581aae1da4e732
          args:
            - -c
            - /etc/coturn/turnserver.conf
          ports:
            - name: turn-tcp
              containerPort: 0
              protocol: TCP
            - name: turn-udp
              containerPort: 0
              protocol: UDP
          readinessProbe:
            tcpSocket:
              port: turn-tcp
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: turn-tcp
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
              add:
                - NET_BIND_SERVICE
          volumeMounts:
            - name: config
              mountPath: /etc/coturn
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: config
          secret:
            secretName: nchat-secrets
            items:
              - key: COTURN_CONFIG
                path: turnserver.conf
        - name: tmp
          emptyDir: {}
