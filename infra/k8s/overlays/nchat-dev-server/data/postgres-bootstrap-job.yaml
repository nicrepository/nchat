apiVersion: batch/v1
kind: Job
metadata:
  name: postgres-bootstrap
  labels:
    app.kubernetes.io/name: nchat
    app.kubernetes.io/part-of: nchat
    app.kubernetes.io/component: postgres-bootstrap
spec:
  backoffLimit: 2
  activeDeadlineSeconds: 180
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: nchat
        app.kubernetes.io/part-of: nchat
        app.kubernetes.io/component: postgres-bootstrap
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      nodeSelector:
        kubernetes.io/hostname: srv-apps-01
      securityContext:
        runAsNonRoot: true
        runAsUser: 70
        runAsGroup: 70
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: postgres-bootstrap
          image: postgres
          command:
            - /bootstrap/postgres-bootstrap.sh
          env:
            - name: PGHOST
              value: postgres
            - name: PGDATABASE
              value: nchat
            - name: PGUSER
              valueFrom:
                secretKeyRef:
                  name: nchat-postgres-admin
                  key: POSTGRES_ADMIN_USER
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: nchat-postgres-admin
                  key: POSTGRES_ADMIN_PASSWORD
            - name: POSTGRES_MIGRATOR_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: nchat-postgres-migrator
                  key: POSTGRES_MIGRATOR_PASSWORD
            - name: POSTGRES_APP_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: nchat-postgres-runtime
                  key: POSTGRES_APP_PASSWORD
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 250m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: bootstrap
              mountPath: /bootstrap
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: bootstrap
          configMap:
            name: postgres-bootstrap
            defaultMode: 0555
        - name: tmp
          emptyDir: {}
