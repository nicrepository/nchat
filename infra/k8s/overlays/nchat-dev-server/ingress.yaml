apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: nchat-dev
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
    # Issue #425: see the identical rule in the k3s-dev overlay. auth-service
    # registers /auth/*, so /api/auth/* must be rewritten before it reaches the
    # pod or every auth route answers 404. Versioning it here also replaces the
    # equivalent rule that had been applied to this cluster out of band, which
    # no manifest described and a re-apply would have silently dropped.
    #
    # RF-23 follow-up: media-service registers /media/*, not /api/media/*, so
    # the same class of bug applies to POST /api/media/media/livekit/token —
    # see media-api-prefix below.
    #
    # file-service is the third instance: it registers /attachments/*, not
    # /api/files/attachments/*. Uploads worked only because the dedicated
    # nchat-dev-uploads IngressRoute already applies strip-files-prefix, so
    # every GET (content, preview, metadata, listing) answered 404. The same
    # middleware is reused here rather than duplicated.
    #
    # All three act on mutually exclusive prefixes — /api/auth, /api/media,
    # /api/files — so chaining them is order-independent and no request outside
    # a middleware's own prefix is touched.
    traefik.ingress.kubernetes.io/router.middlewares: nchat-dev-auth-api-prefix@kubernetescrd,nchat-dev-media-api-prefix@kubernetescrd,nchat-dev-strip-files-prefix@kubernetescrd
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - REPLACE_ME_HOST
      secretName: nchat-dev-tls
  rules:
    - host: REPLACE_ME_HOST
      http:
        paths:
          - path: /api/auth
            pathType: Prefix
            backend:
              service:
                name: auth-service
                port:
                  name: http
          - path: /api/chat
            pathType: Prefix
            backend:
              service:
                name: chat-service
                port:
                  name: http
          - path: /api/files
            pathType: Prefix
            backend:
              service:
                name: file-service
                port:
                  name: http
          - path: /api/notifications
            pathType: Prefix
            backend:
              service:
                name: notification-service
                port:
                  name: http
          - path: /api/admin
            pathType: Prefix
            backend:
              service:
                name: admin-service
                port:
                  name: http
          - path: /api/search
            pathType: Prefix
            backend:
              service:
                name: search-service
                port:
                  name: http
          - path: /api/media
            pathType: Prefix
            backend:
              service:
                name: media-service
                port:
                  name: http
          - path: /
            pathType: Prefix
            backend:
              service:
                name: nchat-web
                port:
                  name: http
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: livekit-strip
spec:
  stripPrefix:
    prefixes:
      - /livekit
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: nchat-dev-livekit
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.middlewares: nchat-dev-livekit-strip@kubernetescrd
    traefik.ingress.kubernetes.io/router.tls: "true"
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - REPLACE_ME_HOST
      secretName: nchat-dev-tls
  rules:
    - host: REPLACE_ME_HOST
      http:
        paths:
          - path: /livekit
            pathType: Prefix
            backend:
              service:
                name: livekit
                port:
                  name: http
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: redirect-https
spec:
  redirectScheme:
    scheme: https
    permanent: true
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: nchat-dev-http
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
    traefik.ingress.kubernetes.io/router.middlewares: nchat-dev-redirect-https@kubernetescrd
spec:
  ingressClassName: traefik
  rules:
    - host: REPLACE_ME_HOST
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: nchat-web
                port:
                  name: http
---
# Rewrites the public /api/auth/<rest> contract onto the /auth/<rest> paths the
# auth-service router actually registers (issue #425). Kept identical across
# every overlay and to the local Traefik gateway so the contract is one rule,
# not three. Paths that do not start with /api/auth/ are left unchanged.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: auth-api-prefix
  labels:
    app.kubernetes.io/name: nchat
    app.kubernetes.io/part-of: nchat
    app.kubernetes.io/managed-by: kustomize
    app.kubernetes.io/component: platform
spec:
  replacePathRegex:
    regex: "^/api/auth/(.*)"
    replacement: "/auth/${1}"
---
# Rewrites the public /api/media/<rest> contract onto the /media/<rest> paths
# the media-service router actually registers. The local Traefik gateway
# (infra/traefik/local/dynamic.yml) already strips /api/media the same way;
# this overlay's Ingress previously forwarded /api/media verbatim, so
# POST /api/media/media/livekit/token reached media-service as
# /api/media/media/livekit/token and answered 404 (no such route). Paths that
# do not start with /api/media/ are left unchanged.
#
# Example: /api/media/media/livekit/token -> /media/livekit/token
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: media-api-prefix
  labels:
    app.kubernetes.io/name: nchat
    app.kubernetes.io/part-of: nchat
    app.kubernetes.io/managed-by: kustomize
    app.kubernetes.io/component: platform
spec:
  replacePathRegex:
    regex: "^/api/media/(.*)"
    replacement: "/${1}"
---
# RF-32: the two attachment upload routes, and only those, go through the
# upload guard. It caps the request body while streaming it, which Traefik's
# buffering middleware cannot do without reading the whole body first — a
# pre-authentication disk-exhaustion vector on exactly these routes.
#
# Everything else under /api/files (health, download, listing, metadata) stays
# on the shared Ingress and reaches file-service directly, so nothing else pays
# the extra hop — the shared Ingress applies the same strip-files-prefix, so
# those requests arrive with the public /api/files prefix removed, exactly as
# they do through this route. This Ingress is matched by method and exact path
# shape, so there is no upload path that reaches file-service around the cap.
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: nchat-dev-uploads
  labels:
    app.kubernetes.io/name: nchat
    app.kubernetes.io/part-of: nchat
    app.kubernetes.io/managed-by: kustomize
    app.kubernetes.io/component: upload-guard
spec:
  entryPoints:
    - websecure
  routes:
    - kind: Rule
      match: Host(`REPLACE_ME_HOST`) && Method(`POST`) && PathRegexp(`^/api/files/(channels|dm)/[^/]+/attachments$`)
      priority: 200
      middlewares:
        - name: upload-inflight
        - name: strip-files-prefix
      services:
        - name: upload-guard
          port: 8080
  # IngressRoute TLS is a mapping, not the Ingress host list: the host the
  # certificate must cover comes from the match rule above.
  tls:
    secretName: nchat-dev-tls
---
# Conservative ceiling on concurrent upload requests at the edge, as
# infrastructure defence in depth.
#
# A total per router, not per source: these sources sit behind corporate NAT and
# other proxies, so an IP-keyed limit would either punish a whole office sharing
# one address or be trivially spread across an IPv6 prefix. It is deliberately
# set above file-service's cluster-wide slot count so it never becomes the
# binding limit — file-service answers 429/503 with a stable code and a
# Retry-After, which is a better answer than a proxy rejection. It substitutes
# for none of authentication, authorization, the per-user limit, distributed
# admission control or the authoritative stream cap.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: upload-inflight
  labels:
    app.kubernetes.io/name: nchat
    app.kubernetes.io/part-of: nchat
    app.kubernetes.io/managed-by: kustomize
    app.kubernetes.io/component: upload-guard
spec:
  inFlightReq:
    amount: 16
---
# Strips the public /api/files prefix so the guard stays a dumb pipe and
# file-service receives the paths it registers. Shared by the upload route above
# and the shared Ingress, which is what makes the upload and the download halves
# of the contract the same rule instead of two that can drift apart.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: strip-files-prefix
  labels:
    app.kubernetes.io/name: nchat
    app.kubernetes.io/part-of: nchat
    app.kubernetes.io/managed-by: kustomize
    app.kubernetes.io/component: upload-guard
spec:
  stripPrefix:
    prefixes:
      - /api/files
