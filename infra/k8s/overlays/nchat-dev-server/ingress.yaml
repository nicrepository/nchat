apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: nchat-dev
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
    # Issue #425: see the identical rule in the k3s-dev overlay. auth-service
    # registers /auth/*, so /api/auth/* must be rewritten before it reaches the
    # pod or every auth route answers 404. Versioning it here also replaces the
    # equivalent rule that had been applied to this cluster out of band, which
    # no manifest described and a re-apply would have silently dropped.
    traefik.ingress.kubernetes.io/router.middlewares: nchat-dev-auth-api-prefix@kubernetescrd
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - REPLACE_ME_HOST
      secretName: nchat-dev-tls
  rules:
    - host: REPLACE_ME_HOST
      http:
        paths:
          - path: /api/auth
            pathType: Prefix
            backend:
              service:
                name: auth-service
                port:
                  name: http
          - path: /api/chat
            pathType: Prefix
            backend:
              service:
                name: chat-service
                port:
                  name: http
          - path: /api/files
            pathType: Prefix
            backend:
              service:
                name: file-service
                port:
                  name: http
          - path: /api/notifications
            pathType: Prefix
            backend:
              service:
                name: notification-service
                port:
                  name: http
          - path: /api/admin
            pathType: Prefix
            backend:
              service:
                name: admin-service
                port:
                  name: http
          - path: /api/search
            pathType: Prefix
            backend:
              service:
                name: search-service
                port:
                  name: http
          - path: /api/media
            pathType: Prefix
            backend:
              service:
                name: media-service
                port:
                  name: http
          - path: /
            pathType: Prefix
            backend:
              service:
                name: nchat-web
                port:
                  name: http
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: livekit-strip
spec:
  stripPrefix:
    prefixes:
      - /livekit
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: nchat-dev-livekit
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.middlewares: nchat-dev-livekit-strip@kubernetescrd
    traefik.ingress.kubernetes.io/router.tls: "true"
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - REPLACE_ME_HOST
      secretName: nchat-dev-tls
  rules:
    - host: REPLACE_ME_HOST
      http:
        paths:
          - path: /livekit
            pathType: Prefix
            backend:
              service:
                name: livekit
                port:
                  name: http
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: redirect-https
spec:
  redirectScheme:
    scheme: https
    permanent: true
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: nchat-dev-http
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
    traefik.ingress.kubernetes.io/router.middlewares: nchat-dev-redirect-https@kubernetescrd
spec:
  ingressClassName: traefik
  rules:
    - host: REPLACE_ME_HOST
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: nchat-web
                port:
                  name: http
---
# Rewrites the public /api/auth/<rest> contract onto the /auth/<rest> paths the
# auth-service router actually registers (issue #425). Kept identical across
# every overlay and to the local Traefik gateway so the contract is one rule,
# not three. Paths that do not start with /api/auth/ are left unchanged.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: auth-api-prefix
  labels:
    app.kubernetes.io/name: nchat
    app.kubernetes.io/part-of: nchat
    app.kubernetes.io/managed-by: kustomize
    app.kubernetes.io/component: platform
spec:
  replacePathRegex:
    regex: "^/api/auth/(.*)"
    replacement: "/auth/${1}"
