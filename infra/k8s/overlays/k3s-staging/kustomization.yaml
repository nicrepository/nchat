apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: nchat-staging
resources:
  - ../../base
  - ingress.yaml
  - tls-option.yaml
labels:
  - includeSelectors: false
    includeTemplates: true
    pairs:
      app.kubernetes.io/instance: k3s-staging
images:
  - name: ghcr.io/nicrepository/nchat/web
    newTag: 0.0.0
  - name: ghcr.io/nicrepository/nchat/auth-service
    newTag: 0.0.0
  - name: ghcr.io/nicrepository/nchat/chat-service
    newTag: 0.0.0
  - name: ghcr.io/nicrepository/nchat/file-service
    newTag: 0.0.0
  - name: ghcr.io/nicrepository/nchat/notification-service
    newTag: 0.0.0
  - name: ghcr.io/nicrepository/nchat/admin-service
    newTag: 0.0.0
  - name: ghcr.io/nicrepository/nchat/search-service
    newTag: 0.0.0
  - name: ghcr.io/nicrepository/nchat/media-service
    newTag: 0.0.0
patches:
  - target:
      kind: Namespace
      name: nchat
    path: namespace-patch.yaml
  - path: patches/web-replicas.yaml
  - path: patches/auth-service-replicas.yaml
  - path: patches/chat-service-replicas.yaml
  - path: patches/file-service-replicas.yaml
  - path: patches/notification-service-replicas.yaml
  - path: patches/admin-service-replicas.yaml
  - path: patches/search-service-replicas.yaml
  - path: patches/media-service-replicas.yaml
