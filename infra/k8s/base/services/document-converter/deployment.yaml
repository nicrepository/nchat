apiVersion: apps/v1
kind: Deployment
metadata:
  name: document-converter
  namespace: nchat
  labels:
    app.kubernetes.io/name: nchat
    app.kubernetes.io/part-of: nchat
    app.kubernetes.io/component: document-converter
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: nchat
      app.kubernetes.io/component: document-converter
  template:
    metadata:
      labels:
        app.kubernetes.io/name: nchat
        app.kubernetes.io/part-of: nchat
        app.kubernetes.io/component: document-converter
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: document-converter
          image: ghcr.io/nicrepository/nchat/document-converter:0.0.0
          imagePullPolicy: IfNotPresent
          env:
            - name: LISTEN_ADDRESS
              value: :8089
            - name: CONVERTER_WORK_DIR
              value: /work
          ports:
            - name: http
              containerPort: 8089
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
              ephemeral-storage: 128Mi
            limits:
              cpu: 500m
              memory: 768Mi
              ephemeral-storage: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: work
              mountPath: /work
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: work
          emptyDir:
            sizeLimit: 128Mi
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
