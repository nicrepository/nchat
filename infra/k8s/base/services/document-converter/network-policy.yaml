apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: document-converter-isolation
  namespace: nchat
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: nchat
      app.kubernetes.io/component: document-converter
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: nchat
              app.kubernetes.io/component: file
      ports:
        - protocol: TCP
          port: 8089
  egress: []
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: nchat-allow-file-document-converter-egress
  namespace: nchat
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: nchat
      app.kubernetes.io/component: file
  policyTypes:
    - Egress
  egress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: nchat
              app.kubernetes.io/component: document-converter
      ports:
        - protocol: TCP
          port: 8089
