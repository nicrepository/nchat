apiVersion: v1
kind: Service
metadata:
  name: clamav
  namespace: nchat
  labels:
    app.kubernetes.io/name: nchat
    app.kubernetes.io/part-of: nchat
    app.kubernetes.io/managed-by: kustomize
    app.kubernetes.io/component: clamav
spec:
  # ClusterIP and nothing else. clamd has no authentication of its own: anyone
  # who can reach 3310 can ask it to scan, and the only client that may is
  # file-service, which nchat-allow-clamav restricts it to. There is
  # deliberately no Ingress, IngressRoute, NodePort, LoadBalancer or hostPort
  # anywhere for this workload.
  type: ClusterIP
  selector:
    app.kubernetes.io/name: nchat
    app.kubernetes.io/part-of: nchat
    app.kubernetes.io/component: clamav
  ports:
    - name: clamd
      port: 3310
      targetPort: clamd
      protocol: TCP
