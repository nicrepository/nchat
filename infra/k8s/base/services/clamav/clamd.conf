# clamd configuration for local development (RF-22).
#
# The limits here are not arbitrary: they are derived from what file-service
# will accept. libs/go/platform/uploadpolicy pins the administrative ceiling at
# MaxMaxUploadBytes = 512 MiB, so an attachment can be exactly that large. If
# clamd refused a stream at, say, its 100 MiB default, that attachment could
# never be scanned — and because a failed scan never approves anything, it would
# sit in pending_scan and stay undownloadable forever. The scanner's limits must
# therefore be at least the uploader's, or the two policies quietly combine into
# a permanent denial.
#
# There are no secrets in this file and it is not sensitive; it is versioned so
# local and CI cannot drift from the numbers the service enforces.

# TCP only: this is what INSTREAM connects to. It listens on the container's own
# interface and is published to 127.0.0.1 by compose, never to the network.
TCPSocket 3310
TCPAddr 0.0.0.0

# Foreground, so the container's lifecycle is the daemon's and compose can see
# it exit rather than supervising a detached process.
Foreground yes

LogTime yes
LogClean no
# The file's name never travels to this daemon — INSTREAM carries bytes only —
# but verbose logging is off regardless: a scanner's log is not a place for a
# record of what people uploaded.
LogVerbose no

# ── Limits, matched to the uploader's ceiling ────────────────────────────────

# The single most important line here. An INSTREAM larger than this is refused
# with "INSTREAM size limit exceeded", which file-service reports as a scan
# failure — never as a clean verdict — so the file simply never becomes
# downloadable. 512 MiB is uploadpolicy.MaxMaxUploadBytes.
StreamMaxLength 512M

# The largest file clamd will examine at all. Below StreamMaxLength it would
# make the stream limit meaningless.
MaxFileSize 512M

# Total bytes clamd will read out of one scan target, including anything it
# unpacks from an archive. It has to exceed MaxFileSize or a compressed
# attachment stops being inspected part-way through.
MaxScanSize 1024M

# Archive handling stays on: an attachment's type is a guess, and refusing to
# look inside containers is how packed malware is missed. The bounds below are
# what keep that from becoming a decompression bomb.
ScanArchive yes
MaxRecursion 12
MaxFiles 10000

# One concurrent scan per worker claim; file-service claims one attachment at a
# time per replica, so a small pool is enough and keeps memory predictable.
MaxThreads 4

# How long clamd will wait on a stalled stream. file-service applies its own
# deadline as well (FILE_MALWARE_SCAN_TIMEOUT_SECONDS); this is the daemon's
# half, so neither side can be held open by the other.
ReadTimeout 300
CommandReadTimeout 30
MaxQueue 100

# ── A verdict must mean a finished scan (TM-01) ──────────────────────────────

# The single most consequential line in this file after StreamMaxLength.
#
# With the default (no), reaching MaxFileSize, MaxScanSize, MaxFiles or
# MaxRecursion makes clamd stop inspecting and answer "... OK". file-service
# reads that as a clean verdict and the delivery gate opens — an approval over a
# file that was only partly examined. With yes, the same event answers
# "... Heuristics.Limits.Exceeded FOUND", which the client classifies as
# infected and persists as rejected.
#
# False positives from this heuristic are accepted deliberately. This gate
# prefers rejecting a legitimate file to approving an uninspected one, which is
# the same direction SECURITY.md already takes for an unavailable scanner. The
# fix for a false positive is to raise the specific limit being hit, with a
# justification — never to set this back to no.
AlertExceedsMax yes

# The engine's own wall-clock ceiling for one scan, in milliseconds.
#
# It is stated rather than left at the 120000 ms default because it takes part
# in a race that decides whether an unfinished scan can look finished. Three
# deadlines exist and they must fire in this order:
#
#   300 s  file-service socket and job deadline (FILE_MALWARE_SCAN_TIMEOUT_SECONDS)
#   330 s  the worker's claim lease (job timeout + 30 s margin)
#   420 s  this value
#
# file-service must win. When it does, the connection is closed, the client
# reports an error, nothing is written, and the attachment stays in
# pending_scan — the fail-closed path. Leaving MaxScanTime at 120000 inverted
# that order and handed the outcome to the engine, which is what the threat
# model rejected.
#
# 420000 is not a value glued to 300 s: it is 120 s (40%) of margin for
# scheduling jitter, CPU throttling at the container's cpu limit, and TCP, and
# it sits strictly above the 330 s lease so the backstop cannot coincide with
# the moment the row becomes claimable again. The effective ceiling is still
# 300 s, because the client hangs up first and clamd abandons the scan of a peer
# that is gone.
#
# If FILE_MALWARE_SCAN_TIMEOUT_SECONDS ever changes, this changes in the same
# commit. scripts/ci/k8s-manifests-check.sh proves the inequality.
MaxScanTime 420000

# ── Parser limits, stated instead of inherited (TM-06) ───────────────────────
#
# These are the values the image already applies. They are written down not to
# change behaviour but to remove a class of surprise: an implicit default is a
# security-relevant number that nobody reviewed and that a base-image bump can
# move silently. With AlertExceedsMax on, every one of them is now a limit that
# turns into a verdict, so each deserves to be visible and versioned.
MaxEmbeddedPE 40M
MaxHTMLNormalize 40M
MaxHTMLNoTags 8M
MaxScriptNormalize 20M
MaxZipTypeRcg 1M
MaxPartitions 50
MaxIconsPE 100
MaxRecHWP3 16
PCREMatchLimit 100000
PCRERecMatchLimit 2000
PCREMaxFileSize 100M

# Deliberately absent, and each absence is a decision:
#
#   User             — the UID comes from the pod's securityContext. With
#                      capabilities dropped, clamd could not perform the switch
#                      this directive asks for.
#   LocalSocket      — TCP only, so probes and file-service use the same
#                      endpoint. A unix socket is what makes the image's own
#                      clamdcheck.sh report unhealthy against this config.
#   PidFile          — nothing supervises clamd but the kubelet.
#   ForceToDisk      — off, so embedded files are not all spilled to /tmp. The
#                      /tmp volume is still bounded (sizeLimit 2Gi) for the
#                      scratch that INSTREAM and archive scanning do produce.
