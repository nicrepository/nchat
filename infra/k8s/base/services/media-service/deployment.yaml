apiVersion: apps/v1
kind: Deployment
metadata:
  name: media-service
  namespace: nchat
  labels:
    app.kubernetes.io/name: nchat
    app.kubernetes.io/part-of: nchat
    app.kubernetes.io/managed-by: kustomize
    app.kubernetes.io/component: media
    app.kubernetes.io/version: "0.0.0"
  annotations:
    nchat.nicrepository.io/image-placeholder: "true"
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: nchat
      app.kubernetes.io/part-of: nchat
      app.kubernetes.io/component: media
  template:
    metadata:
      labels:
        app.kubernetes.io/name: nchat
        app.kubernetes.io/part-of: nchat
        app.kubernetes.io/managed-by: kustomize
        app.kubernetes.io/component: media
        app.kubernetes.io/version: "0.0.0"
      annotations:
        nchat.nicrepository.io/image-placeholder: "true"
    spec:
      serviceAccountName: nchat-media-service
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: media-service
          image: ghcr.io/nicrepository/nchat/media-service:0.0.0
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: nchat-config
            - secretRef:
                name: nchat-secrets
                optional: true
          env:
            - name: PORT
              value: "8087"
            - name: SERVICE_NAME
              value: media-service
          ports:
            - name: http
              containerPort: 8087
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 2
            failureThreshold: 3
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
            failureThreshold: 12
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
