apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
  namespace: nchat
  labels:
    app.kubernetes.io/name: nchat
    app.kubernetes.io/part-of: nchat
    app.kubernetes.io/managed-by: kustomize
    app.kubernetes.io/component: auth
    app.kubernetes.io/version: "0.0.0"
  annotations:
    nchat.nicrepository.io/image-placeholder: "true"
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: nchat
      app.kubernetes.io/part-of: nchat
      app.kubernetes.io/component: auth
  template:
    metadata:
      labels:
        app.kubernetes.io/name: nchat
        app.kubernetes.io/part-of: nchat
        app.kubernetes.io/managed-by: kustomize
        app.kubernetes.io/component: auth
        app.kubernetes.io/version: "0.0.0"
      annotations:
        nchat.nicrepository.io/image-placeholder: "true"
    spec:
      serviceAccountName: nchat-auth-service
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: auth-service
          image: ghcr.io/nicrepository/nchat/auth-service:0.0.0
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: nchat-config
            - secretRef:
                name: nchat-secrets
                optional: true
          env:
            - name: PORT
              value: "8081"
            - name: SERVICE_NAME
              value: auth-service
            - name: OIDC_ISSUER_URL
              valueFrom:
                secretKeyRef:
                  name: nchat-secrets
                  key: OIDC_ISSUER_URL
                  optional: true
            - name: OIDC_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: nchat-secrets
                  key: OIDC_CLIENT_ID
                  optional: true
            - name: OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: nchat-secrets
                  key: OIDC_CLIENT_SECRET
                  optional: true
            - name: OIDC_REDIRECT_URL
              valueFrom:
                secretKeyRef:
                  name: nchat-secrets
                  key: OIDC_REDIRECT_URL
                  optional: true
            - name: OIDC_FRONTEND_CALLBACK_URL
              valueFrom:
                secretKeyRef:
                  name: nchat-secrets
                  key: OIDC_FRONTEND_CALLBACK_URL
                  optional: true
          ports:
            - name: http
              containerPort: 8081
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 2
            failureThreshold: 3
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
            failureThreshold: 12
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
