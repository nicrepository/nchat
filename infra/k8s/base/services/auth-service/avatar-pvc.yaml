apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: auth-service-avatars
  namespace: nchat
  labels:
    app.kubernetes.io/name: nchat
    app.kubernetes.io/part-of: nchat
    app.kubernetes.io/managed-by: kustomize
    app.kubernetes.io/component: auth
spec:
  # Avatars are small (256px PNGs, a few KiB each); ReadWriteOnce is sufficient
  # because a single auth-service replica owns writes and serves reads. Scaling
  # writers would require RWX or moving blobs to object storage — see the avatar
  # data-model doc.
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
