apiVersion: apps/v1
kind: Deployment
metadata:
  name: file-service
  namespace: nchat
  labels:
    app.kubernetes.io/name: nchat
    app.kubernetes.io/part-of: nchat
    app.kubernetes.io/managed-by: kustomize
    app.kubernetes.io/component: file
    app.kubernetes.io/version: "0.0.0"
  annotations:
    nchat.nicrepository.io/image-placeholder: "true"
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: nchat
      app.kubernetes.io/part-of: nchat
      app.kubernetes.io/component: file
  template:
    metadata:
      labels:
        app.kubernetes.io/name: nchat
        app.kubernetes.io/part-of: nchat
        app.kubernetes.io/managed-by: kustomize
        app.kubernetes.io/component: file
        app.kubernetes.io/version: "0.0.0"
      annotations:
        nchat.nicrepository.io/image-placeholder: "true"
    spec:
      serviceAccountName: nchat-file-service
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: file-service
          image: ghcr.io/nicrepository/nchat/file-service:0.0.0
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: nchat-config
            - secretRef:
                name: nchat-secrets
                optional: true
            # RF-33 / RNF-17: the attachment envelope-encryption key ring, kept
            # out of the shared nchat-secrets so that no other service receives
            # it through its own envFrom. Optional for the same reason the shared
            # one is: with FILE_UPLOADS_ENABLED=false the service is health-only
            # and needs no key, and with uploads enabled a missing key stops
            # start-up in Config.Validate rather than being silently defaulted.
            - secretRef:
                name: nchat-file-encryption
                optional: true
          env:
            - name: PORT
              value: "8083"
            - name: SERVICE_NAME
              value: file-service
          ports:
            - name: http
              containerPort: 8083
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 2
            failureThreshold: 3
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
            failureThreshold: 12
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
