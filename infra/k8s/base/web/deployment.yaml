apiVersion: apps/v1
kind: Deployment
metadata:
  name: nchat-web
  namespace: nchat
  labels:
    app.kubernetes.io/name: nchat
    app.kubernetes.io/part-of: nchat
    app.kubernetes.io/managed-by: kustomize
    app.kubernetes.io/component: web
    app.kubernetes.io/version: "0.0.0"
  annotations:
    nchat.nicrepository.io/image-placeholder: "true"
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: nchat
      app.kubernetes.io/part-of: nchat
      app.kubernetes.io/component: web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: nchat
        app.kubernetes.io/part-of: nchat
        app.kubernetes.io/managed-by: kustomize
        app.kubernetes.io/component: web
        app.kubernetes.io/version: "0.0.0"
      annotations:
        nchat.nicrepository.io/image-placeholder: "true"
    spec:
      serviceAccountName: nchat-web
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: web
          image: ghcr.io/nicrepository/nchat/web:0.0.0
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: nchat-config
            - secretRef:
                name: nchat-secrets
                optional: true
          env:
            - name: APP_ENV
              value: development
            - name: PORT
              value: "8080"
            - name: SERVICE_NAME
              value: web
            # Allowlist de connect-src para LiveKit por ambiente (issue #528).
            # Vazio no base; cada overlay que precisar de LiveKit define o
            # valor (ver infra/k8s/overlays/nchat-dev-server/patches/web.yaml).
            - name: NCHAT_WEB_LIVEKIT_CONNECT_SRC
              value: ""
          # Startup (envsubst restrito + exec nginx) vem só da imagem
          # (Dockerfile.web CMD); nenhum command/args aqui, para não ter dois
          # lugares definindo o mesmo fluxo (issue #528 review).
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 2
            failureThreshold: 3
          startupProbe:
            tcpSocket:
              port: http
            periodSeconds: 5
            failureThreshold: 12
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            # readOnlyRootFilesystem: true torna /etc/nginx/conf.d somente
            # leitura na camada da imagem; o fragmento renderizado por
            # envsubst precisa de um destino gravável nesse caminho exato
            # para ser pego por "include /etc/nginx/conf.d/*.conf;" do
            # nginx.conf principal da imagem base.
            - name: conf-d
              mountPath: /etc/nginx/conf.d
      volumes:
        - name: tmp
          emptyDir: {}
        - name: conf-d
          emptyDir: {}
