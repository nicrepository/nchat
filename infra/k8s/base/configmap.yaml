apiVersion: v1
kind: ConfigMap
metadata:
  name: nchat-config
  namespace: nchat
  labels:
    app.kubernetes.io/name: nchat
    app.kubernetes.io/part-of: nchat
    app.kubernetes.io/managed-by: kustomize
    app.kubernetes.io/component: platform
data:
  APP_ENV: development
  LOG_LEVEL: info
  READ_HEADER_TIMEOUT_SECONDS: "5"
  AUTH_JWT_ISSUER: nchat-auth
  AUTH_JWT_AUDIENCE: nchat-api
  AUTH_ACCESS_TOKEN_TTL_SECONDS: "900"
  AUTH_REFRESH_TOKEN_TTL_SECONDS: "2592000"
  AUTH_TOKEN_ENDPOINT_RATE_LIMIT_PER_MINUTE: "60"
  AUTH_TOKEN_ENDPOINT_RATE_LIMIT_BURST: "10"
  POSTGRES_HOST: postgres
  POSTGRES_PORT: "5432"
  POSTGRES_DB: nchat
  VALKEY_HOST: valkey
  VALKEY_PORT: "6379"
  SEAWEEDFS_FILER_URL: http://seaweedfs-filer:8888
  SEAWEEDFS_S3_ENDPOINT: http://seaweedfs-s3:8333
