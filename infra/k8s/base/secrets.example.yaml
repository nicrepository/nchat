apiVersion: v1
kind: Secret
metadata:
  name: nchat-secrets
  namespace: nchat
  labels:
    app.kubernetes.io/name: nchat
    app.kubernetes.io/part-of: nchat
    app.kubernetes.io/managed-by: kustomize
    app.kubernetes.io/component: platform
  annotations:
    nchat.nicrepository.io/example-only: "true"
type: Opaque
stringData:
  DATABASE_URL: ""
  POSTGRES_USER: ""
  POSTGRES_PASSWORD: ""
  VALKEY_PASSWORD: ""
  VALKEY_URL: ""
  AUTH_JWT_HMAC_SECRET: ""
  AUTH_EMAIL_OUTBOX_ENCRYPTION_KEY: ""
  # The attachment envelope-encryption key is not part of this shared Secret:
  # it is scoped to file-service alone, in nchat-file-encryption.
  LIVEKIT_API_KEY: ""
  LIVEKIT_API_SECRET: ""
