apiVersion: v1
kind: Secret
metadata:
  name: nchat-secrets
  namespace: nchat-dev
type: Opaque
stringData:
  ADMIN_BOOTSTRAP_TOKEN: ""
  VALKEY_PASSWORD: REPLACE_ME
  VALKEY_URL: REPLACE_ME
  AUTH_JWT_HMAC_SECRET: REPLACE_ME
  AUTH_EMAIL_OUTBOX_ENCRYPTION_KEY: REPLACE_ME
  OIDC_ISSUER_URL: ""
  OIDC_CLIENT_ID: ""
  OIDC_CLIENT_SECRET: ""
  OIDC_REDIRECT_URL: ""
  # Administrative console callback (issue #578). Must be the console host's
  # /api/auth/oidc/keycloak/callback, and must be registered as a second Valid
  # Redirect URI on the same Keycloak client as OIDC_REDIRECT_URL. Empty
  # disables single sign-on on the console host.
  OIDC_ADMIN_REDIRECT_URL: ""
  OIDC_FRONTEND_CALLBACK_URL: /oidc-callback
  SMTP_PASSWORD: ""
  LIVEKIT_KEYS: REPLACE_ME
  LIVEKIT_CONFIG: REPLACE_ME
  COTURN_CONFIG: REPLACE_ME
