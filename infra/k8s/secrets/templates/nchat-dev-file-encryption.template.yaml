# Template only: empty values, never sealed, never applied.
#
# The nchat-dev counterpart of nchat-file-encryption.template.yaml. A SealedSecret
# is scoped strictly to a name and a namespace, so the dev cluster needs its own
# sealed manifest built from this template — the nchat one cannot be reused.
#
# Generate the values, never commit them:
#   FILE_ENCRYPTION_MASTER_KEY    openssl rand -base64 32   (exactly 32 bytes)
#   FILE_ENCRYPTION_MASTER_KEY_ID a dated label, e.g. kek-2026-08
#   FILE_ENCRYPTION_PREVIOUS_KEYS empty except during a rotation
#
# Sealing and rotation: docs/runbooks/sealed-secrets-rotation.md and
# docs/runbooks/file-service-envelope-encryption.md.
apiVersion: v1
kind: Secret
metadata:
  name: nchat-file-encryption
  namespace: nchat-dev
type: Opaque
stringData:
  FILE_ENCRYPTION_MASTER_KEY: REPLACE_ME
  FILE_ENCRYPTION_MASTER_KEY_ID: REPLACE_ME
  FILE_ENCRYPTION_PREVIOUS_KEYS: ""
