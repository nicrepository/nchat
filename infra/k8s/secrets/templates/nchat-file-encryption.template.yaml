# Template only: empty values, never sealed, never applied.
#
# The RF-33 / RNF-17 envelope-encryption key ring for file-service. It is its
# own Secret rather than a key inside nchat-secrets because every service mounts
# nchat-secrets with envFrom, which would hand the attachment KEK to seven
# services that must never see it. Only the file-service Deployment references
# this one.
#
# FILE_ENCRYPTION_MASTER_KEY
#   Standard base64 of exactly 32 random bytes — the active KEK, which wraps
#   every new attachment's per-file data key:
#       openssl rand -base64 32
#   There is no default and no fallback: file-service refuses to start with
#   FILE_UPLOADS_ENABLED=true and an absent, mis-encoded or wrong-length value.
#
# FILE_ENCRYPTION_MASTER_KEY_ID
#   The non-secret label persisted with every wrapped data key so a download
#   knows which KEK opens it. Lowercase [a-z0-9][a-z0-9._-]{0,63}; use a dated
#   label such as kek-2026-08. Required.
#
# FILE_ENCRYPTION_PREVIOUS_KEYS
#   Optional, and empty except during a rotation: comma-separated "id:key" pairs
#   for KEKs kept only so objects wrapped before the rotation can still be read.
#   New uploads always use the active key.
#
# Sealing and rotation: docs/runbooks/sealed-secrets-rotation.md and
# docs/runbooks/file-service-envelope-encryption.md.
apiVersion: v1
kind: Secret
metadata:
  name: nchat-file-encryption
  namespace: nchat
type: Opaque
stringData:
  FILE_ENCRYPTION_MASTER_KEY: ""
  FILE_ENCRYPTION_MASTER_KEY_ID: ""
  FILE_ENCRYPTION_PREVIOUS_KEYS: ""
