apiVersion: v1
kind: Secret
metadata:
  name: nchat-secrets
  namespace: nchat
type: Opaque
stringData:
  DATABASE_URL: ""
  POSTGRES_USER: ""
  POSTGRES_PASSWORD: ""
  VALKEY_PASSWORD: ""
  VALKEY_URL: ""
  AUTH_JWT_HMAC_SECRET: ""
  AUTH_EMAIL_OUTBOX_ENCRYPTION_KEY: ""
  OIDC_ISSUER_URL: ""
  OIDC_CLIENT_ID: ""
  OIDC_CLIENT_SECRET: ""
  OIDC_REDIRECT_URL: ""
  # Administrative console callback (issue #578). Must be the console host's
  # /api/auth/oidc/keycloak/callback, and must be registered as a second Valid
  # Redirect URI on the same Keycloak client as OIDC_REDIRECT_URL. Empty
  # disables single sign-on on the console host.
  OIDC_ADMIN_REDIRECT_URL: ""
  OIDC_FRONTEND_CALLBACK_URL: "/oidc-callback"
  # The attachment envelope-encryption key is deliberately NOT here: every
  # service mounts this Secret with envFrom, so a key placed in it would be
  # handed to services that must never see it. It lives in its own Secret,
  # referenced only by the file-service Deployment; see
  # nchat-file-encryption.template.yaml.
  SMTP_PASSWORD: ""
  LIVEKIT_API_KEY: ""
  LIVEKIT_API_SECRET: ""
