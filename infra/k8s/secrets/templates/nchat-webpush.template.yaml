# Template only: empty values, never sealed, never applied.
#
# The Web Push (VAPID, RFC 8292) identity of one environment (issue #862). The
# notification-service signs every push with the private key, and serves the
# public key to browsers through GET /api/notifications/push/config, so the web
# image carries no key and the two halves cannot disagree.
#
# It is its own Secret and not a key inside nchat-secrets for the reason stated
# in nchat-file-encryption.template.yaml: every service mounts nchat-secrets
# with envFrom, which would hand a signing key to services that never send a
# push. Only the notification-service Deployment references this one.
#
# NOTIFICATION_VAPID_PUBLIC_KEY / NOTIFICATION_VAPID_PRIVATE_KEY
#   One P-256 pair, base64url (unpadded is what generators emit): the public key
#   is the 65-byte uncompressed point, the private key the 32-byte scalar. Both
#   come from the same generation — the service refuses to become ready with a
#   key that is not a key or two keys that are not a pair. The public key is not
#   secret; it lives here so the pair is always sealed, rotated and restored
#   together.
#
#   Generate once per environment and keep it: every browser subscription is
#   bound to the public key it was created with. Rotating the pair orphans all of
#   them until each browser reconnects (the client re-subscribes automatically on
#   its next visit). Never reuse one environment's pair in another.
#
# NOTIFICATION_VAPID_SUBJECT
#   mailto: or https: contact for the push services (FCM, Mozilla, WNS) to reach
#   whoever operates this environment. Not secret; kept beside the pair it
#   describes.
#
# Nothing here enables delivery. NOTIFICATION_WORKER_ENABLED=true in the
# environment's ConfigMap does, and only once this Secret is applied.
#
# Sealing and rotation: docs/runbooks/sealed-secrets-rotation.md.
apiVersion: v1
kind: Secret
metadata:
  name: nchat-webpush
  namespace: nchat
type: Opaque
stringData:
  NOTIFICATION_VAPID_PUBLIC_KEY: ""
  NOTIFICATION_VAPID_PRIVATE_KEY: ""
  NOTIFICATION_VAPID_SUBJECT: ""
