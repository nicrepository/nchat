# Template only: empty values, never sealed, never applied.
#
# The RF-21 Safe Browsing credentials, for two providers (issue #928).
#
# chat-service consults Google Web Risk first and Cloudflare URL Scanner when
# Web Risk cannot answer. file-service consults Cloudflare only, for link-preview
# targets, and deliberately does not receive the Google key: it has no call site
# for it, and its Deployment names the two keys it needs rather than mounting
# this Secret wholesale.
#
# The two services share the same Cloudflare account and each reads it under its
# own variable name, so the same pair of values is written twice here rather
# than the code being changed to share one name.
#
# It is its own Secret and not a key inside nchat-secrets for the reason stated
# in nchat-file-encryption.template.yaml: every service mounts nchat-secrets
# with envFrom, which would hand an API token to six services that never call
# Cloudflare. Only the chat-service and file-service Deployments reference this
# one.
#
# CHAT_LINK_SAFETY_GOOGLE_WEBRISK_API_KEY
#   The primary provider's credential: a Google Cloud API key for a project with
#   the Web Risk API enabled. Restrict it at Google to that single API and to
#   this deployment's egress addresses — an unrestricted key is a key anybody who
#   obtains it can spend.
#
#   chat-service calls exactly one endpoint with it:
#
#       GET https://webrisk.googleapis.com/v1/uris:search
#
#   and sends it in an X-Goog-Api-Key header, never as a query parameter, so it
#   cannot reach an access log, a referrer or a transport error message.
#
#   chat-service only. file-service has no Web Risk call site, and this key is
#   not mounted there.
#
# CHAT_LINK_SAFETY_CLOUDFLARE_ACCOUNT_ID / FILE_LINK_SAFETY_CLOUDFLARE_ACCOUNT_ID
#   The Cloudflare account id that owns the URL Scanner subscription. Same value
#   in both keys.
#
# CHAT_LINK_SAFETY_CLOUDFLARE_API_TOKEN / FILE_LINK_SAFETY_CLOUDFLARE_API_TOKEN
#   A custom API token created with Account > URL Scanner in the Permissions
#   group and *Edit* as the access level. Edit and not Read because submitting a
#   scan creates one:
#
#       POST /accounts/{account_id}/urlscanner/v2/scan
#       GET  /accounts/{account_id}/urlscanner/v2/result/{scan_id}
#       GET  /accounts/{account_id}/urlscanner/v2/search
#
#   are the only three endpoints NChat calls. The search is the recovery path
#   for a submission whose outcome was never recorded: before ever submitting
#   again, NChat asks whether the scan it may have created already exists. It
#   reads the account's own scans and needs no permission beyond the URL Scanner
#   group already granted above — the same token, the same scope, no second
#   credential. Do not grant Intel permissions:
#   Domain Intelligence answers about a domain, which is the granularity RF-21
#   may not decide at, and it is not on this path (see issue #526).
#
#   Same value in both keys. It is sent only in an Authorization header to
#   Cloudflare and is never logged, echoed in an error, or returned to a client.
#
# There is no default and no fallback-to-nothing. With
# CHAT_LINK_SAFETY_ENABLED=true or FILE_LINK_SAFETY_ENABLED=true, an absent value
# stops the service in Config.Validate rather than silently disabling the check —
# enabled-with-no-checker would accept every link unchecked, which is the state
# RF-21 exists to prevent. That applies to the Web Risk key as strictly as to the
# Cloudflare pair: chat-service starting with only a fallback configured would be
# the pre-#928 arrangement, reached by omission and with no symptom other than
# ordinary links staying permanently unverified. An environment with neither
# provider sets the flags to false and leaves this Secret unapplied.
#
# Sealing and rotation: docs/runbooks/sealed-secrets-rotation.md.
apiVersion: v1
kind: Secret
metadata:
  name: nchat-link-safety
  namespace: nchat
type: Opaque
stringData:
  CHAT_LINK_SAFETY_GOOGLE_WEBRISK_API_KEY: ""
  CHAT_LINK_SAFETY_CLOUDFLARE_ACCOUNT_ID: ""
  CHAT_LINK_SAFETY_CLOUDFLARE_API_TOKEN: ""
  FILE_LINK_SAFETY_CLOUDFLARE_ACCOUNT_ID: ""
  FILE_LINK_SAFETY_CLOUDFLARE_API_TOKEN: ""
