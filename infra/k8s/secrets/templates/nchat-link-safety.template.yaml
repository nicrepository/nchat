# Template only: empty values, never sealed, never applied.
#
# The RF-21 Safe Browsing credentials. Two services consult the same Cloudflare
# URL Scanner account — chat-service checks message bodies, file-service checks
# link-preview targets — and each reads it under its own variable name, so the
# same pair of values is written twice here rather than the code being changed
# to share one name.
#
# It is its own Secret and not a key inside nchat-secrets for the reason stated
# in nchat-file-encryption.template.yaml: every service mounts nchat-secrets
# with envFrom, which would hand an API token to six services that never call
# Cloudflare. Only the chat-service and file-service Deployments reference this
# one.
#
# CHAT_LINK_SAFETY_CLOUDFLARE_ACCOUNT_ID / FILE_LINK_SAFETY_CLOUDFLARE_ACCOUNT_ID
#   The Cloudflare account id that owns the URL Scanner subscription. Same value
#   in both keys.
#
# CHAT_LINK_SAFETY_CLOUDFLARE_API_TOKEN / FILE_LINK_SAFETY_CLOUDFLARE_API_TOKEN
#   A custom API token created with Account > URL Scanner in the Permissions
#   group and *Edit* as the access level. Edit and not Read because submitting a
#   scan creates one:
#
#       POST /accounts/{account_id}/urlscanner/v2/scan
#       GET  /accounts/{account_id}/urlscanner/v2/result/{scan_id}
#       GET  /accounts/{account_id}/urlscanner/v2/search
#
#   are the only three endpoints NChat calls. The search is the recovery path
#   for a submission whose outcome was never recorded: before ever submitting
#   again, NChat asks whether the scan it may have created already exists. It
#   reads the account's own scans and needs no permission beyond the URL Scanner
#   group already granted above — the same token, the same scope, no second
#   credential. Do not grant Intel permissions:
#   Domain Intelligence answers about a domain, which is the granularity RF-21
#   may not decide at, and it is not on this path (see issue #526).
#
#   Same value in both keys. It is sent only in an Authorization header to
#   Cloudflare and is never logged, echoed in an error, or returned to a client.
#
# There is no default and no fallback. With CHAT_LINK_SAFETY_ENABLED=true or
# FILE_LINK_SAFETY_ENABLED=true, an absent value stops the service in
# Config.Validate rather than silently disabling the check — enabled-with-no-
# checker would accept every link unchecked, which is the state RF-21 exists to
# prevent. An environment without a Cloudflare account sets the flags to false
# instead and leaves this Secret unapplied.
#
# Sealing and rotation: docs/runbooks/sealed-secrets-rotation.md.
apiVersion: v1
kind: Secret
metadata:
  name: nchat-link-safety
  namespace: nchat
type: Opaque
stringData:
  CHAT_LINK_SAFETY_CLOUDFLARE_ACCOUNT_ID: ""
  CHAT_LINK_SAFETY_CLOUDFLARE_API_TOKEN: ""
  FILE_LINK_SAFETY_CLOUDFLARE_ACCOUNT_ID: ""
  FILE_LINK_SAFETY_CLOUDFLARE_API_TOKEN: ""
