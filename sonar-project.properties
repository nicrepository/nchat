sonar.projectKey=nicrepository_nchat_e7730137-16c9-4336-877e-35f3acddc575
sonar.projectName=NChat
sonar.sourceEncoding=UTF-8

# Codigo de producao e testes convivem nas mesmas arvores do monorepo, entao
# sources e tests apontam para os mesmos diretorios e a separacao e feita por
# padrao de arquivo. packages/ ainda nao tem codigo, mas ja fica coberto.
sonar.sources=apps,libs,packages,services
sonar.tests=apps,libs,packages,services

# Artefatos gerados que realmente existem no repositorio, mais os arquivos que
# pertencem ao lado de teste (declarados em sonar.test.inclusions).
sonar.exclusions=**/node_modules/**,**/dist/**,**/build/**,**/coverage/**,**/vendor/**,**/playwright-report/**,**/test-results/**,**/.scannerwork/**,**/*.test.ts,**/*.test.tsx,**/*.spec.ts,**/*.spec.tsx,**/*_test.go,**/e2e/**,**/setupTests.ts,libs/testdata/**

# *.test.ts(x) sao as suites Vitest, *.spec.ts as suites Playwright em e2e/, e
# *_test.go as suites Go. libs/testdata guarda apenas fixtures de teste.
sonar.test.inclusions=**/*.test.ts,**/*.test.tsx,**/*.spec.ts,**/*.spec.tsx,**/*_test.go,**/e2e/**,**/setupTests.ts,libs/testdata/**
sonar.test.exclusions=**/node_modules/**,**/dist/**,**/build/**,**/coverage/**,**/vendor/**,**/playwright-report/**,**/test-results/**,**/.scannerwork/**

# Relatorios ja produzidos por `pnpm test:coverage`: LCOV do Vitest de cada app
# e os profiles finais que o gate de 90% do Go usa (scripts/ci/go-coverage-check.sh),
# incluindo o merge com as suites PostgreSQL do RF-21.
sonar.javascript.lcov.reportPaths=coverage/web/lcov.info,coverage/admin-web/lcov.info
sonar.go.coverage.reportPaths=coverage/go/*.threshold.out

# Fora da medicao por decisao dos gates existentes: go-coverage-check.sh nao mede
# pacotes cmd/, e o coverage do Vitest nao instrumenta configuracao nem bootstrap.
sonar.coverage.exclusions=**/cmd/**,**/*.config.ts,**/*.config.js,**/main.tsx
